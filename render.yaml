services:
  - type: web
    name: cinemymovies
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTH_DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.8
