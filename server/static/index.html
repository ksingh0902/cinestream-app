<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>CineMyMovies - Stream Movies &amp; Series</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
:root {
  --bg: #0e0f13;
  --card: #181a20;
  --card-hover: #222630;
  --accent: #ff7b39;
  --accent-glow: rgba(255,123,57,0.25);
  --txt: #ececed;
  --dim: #9aa0aa;
  --border: #262932;
}

html {
  box-sizing: border-box;
  -webkit-text-size-adjust: 100%;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
}
*, *:before, *:after {
  box-sizing: inherit;
}
body {
  margin: 0;
  padding: 0;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
  position: relative;
  background: var(--bg);
  color: var(--txt);
  font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* Header System */
header {
  position: sticky;
  top: 0;
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 18px;
  background: #0e0f13f0;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid #1c1f26;
  width: 100%;
  max-width: 100vw;
}
.header-top-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
h1 {
  font-size: 20px;
  margin: 0;
  color: var(--accent);
  cursor: pointer;
  user-select: none;
  transition: transform .15s;
  flex-shrink: 0;
  letter-spacing: -0.3px;
  font-weight: 800;
}
h1:hover {
  transform: scale(1.03);
}
.header-controls {
  display: flex;
  align-items: center;
  gap: 7px;
}
select {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--txt);
  padding: 8px 10px;
  border-radius: 8px;
  outline: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: border-color .15s, background .15s;
}
select:focus {
  border-color: var(--accent);
}
.btn-density {
  display: none; /* Auto-shown on mobile screens via media query */
  align-items: center;
  justify-content: center;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--dim);
  padding: 0 9px;
  height: 32px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 11.5px;
  font-weight: 600;
  transition: .15s;
  user-select: none;
  white-space: nowrap;
}
.btn-density:hover, .btn-density:active {
  color: #fff;
  border-color: var(--accent);
  background: var(--card-hover);
}

.search-wrap {
  position: relative;
  flex: 1;
  max-width: 440px;
  display: flex;
  align-items: center;
}
.search-ico {
  position: absolute;
  left: 11px;
  width: 15px;
  height: 15px;
  color: var(--dim);
  pointer-events: none;
}
#q {
  width: 100%;
  padding: 8px 30px 8px 34px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--txt);
  border-radius: 8px;
  outline: none;
  font-size: 13.5px;
  transition: border-color .15s, box-shadow .15s;
}
#q:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.q-clear {
  position: absolute;
  right: 8px;
  background: none;
  border: none;
  color: var(--dim);
  font-size: 18px;
  cursor: pointer;
  padding: 2px 6px;
  line-height: 1;
  display: none;
  border-radius: 4px;
}
.q-clear:hover {
  color: #fff;
  background: #ffffff15;
}

/* Horizontal Category Filter Bar - Strictly Pan X without viewport overflow */
.filter-bar {
  display: flex;
  gap: 6px;
  padding: 10px 14px 6px;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x;
  align-items: center;
  width: 100%;
  max-width: 100vw;
}
.filter-bar::-webkit-scrollbar {
  display: none;
}
.pill {
  flex-shrink: 0;
  background: #14161d;
  border: 1px solid var(--border);
  color: var(--dim);
  padding: 6px 13px;
  border-radius: 18px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: .15s;
  user-select: none;
}
.pill:hover {
  color: #fff;
  background: #20242e;
  border-color: #3e4452;
}
.pill.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  box-shadow: 0 3px 12px rgba(255,123,57,0.32);
}
.pill-divider {
  width: 1px;
  height: 18px;
  background: var(--border);
  margin: 0 2px;
  flex-shrink: 0;
}

/* Search Dropdown System */
.search-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  background: #13151b;
  border: 1px solid #2a2d36;
  border-radius: 9px;
  box-shadow: 0 14px 40px rgba(0,0,0,0.88);
  max-height: 60vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: none;
  z-index: 50;
}
.search-dropdown.open {
  display: block;
}
.s-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  cursor: pointer;
  transition: background .15s;
  border-bottom: 1px solid #1a1d24;
  text-decoration: none;
}
.s-item:last-child {
  border-bottom: none;
}
.s-item:hover, .s-item.active {
  background: #1e222c;
}
.s-thumb {
  width: 36px;
  height: 50px;
  object-fit: cover;
  border-radius: 4px;
  background: #222;
  flex-shrink: 0;
}
.s-info {
  flex: 1;
  min-width: 0;
}
.s-title {
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.s-meta {
  font-size: 11px;
  color: var(--dim);
  margin-top: 2px;
  display: flex;
  gap: 6px;
  align-items: center;
}
.s-badge {
  background: rgba(255,123,57,0.18);
  color: var(--accent);
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 9.5px;
  font-weight: 600;
}
.s-footer {
  padding: 9px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  text-align: center;
  background: #161820;
  cursor: pointer;
  transition: background .15s;
  border-top: 1px solid #242730;
}
.s-footer:hover {
  background: #20242e;
  text-decoration: underline;
}
.s-empty {
  padding: 16px;
  text-align: center;
  color: var(--dim);
  font-size: 12.5px;
}

/* Movie Poster Grid System - Mobile Friendly Compact Cards */
#grid {
  display: grid;
  width: 100%;
  max-width: 100vw;
  box-sizing: border-box;
  transition: opacity .15s;
}
#grid.loading {
  opacity: 0.35;
  pointer-events: none;
}

.card {
  position: relative;
  background: var(--card);
  overflow: hidden;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  display: flex;
  flex-direction: column;
  user-select: none;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}
.card img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  background: #191b22;
}
.card .m {
  color: var(--dim);
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: auto;
}
.card-badges {
  position: absolute;
  top: 7px;
  left: 7px;
  display: flex;
  align-items: center;
  gap: 4px;
  z-index: 2;
  pointer-events: none;
  flex-wrap: wrap;
  max-width: calc(100% - 14px);
}
.card-badges .badge {
  position: static;
  top: auto;
  left: auto;
  max-width: none;
}
.badge {
  position: absolute;
  background: rgba(0,0,0,0.82);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  color: var(--accent);
  font-weight: 700;
  max-width: calc(100% - 10px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
  z-index: 2;
}
.badge-ask {
  background: #ea580c !important;
  color: #fff !important;
  font-weight: 700 !important;
  box-shadow: 0 2px 8px rgba(234,88,12,0.4) !important;
}
.badge-ym {
  background: #1d4ed8 !important;
  color: #fff !important;
  font-weight: 700 !important;
  box-shadow: 0 2px 8px rgba(29,78,216,0.4) !important;
}
.badge-dub {
  background: #059669 !important;
  color: #fff !important;
  font-weight: 700 !important;
  box-shadow: 0 2px 8px rgba(5,150,105,0.45) !important;
  border: 1px solid rgba(255,255,255,0.2) !important;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  letter-spacing: 0.2px;
}
.badge-dub .dub-txt-short { display: none; }
.badge-dub .dub-txt-full { display: inline; }
.badge-series {
  position: absolute;
  background: rgba(0,150,255,0.88);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  color: #fff;
  font-weight: 700;
  pointer-events: none;
  z-index: 2;
}

/* Breakpoint 1: Standard Desktop & Large Screens (> 860px) */
@media (min-width: 861px) {
  #grid {
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 14px;
    padding: 16px 18px 36px;
  }
  .card {
    border-radius: 9px;
  }
  .card .t {
    padding: 8px 9px 3px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card .m {
    padding: 0 9px 9px;
    font-size: 11px;
  }
  .badge {
    top: 7px;
    left: 7px;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .badge-series {
    top: 7px;
    right: 7px;
    font-size: 9.5px;
    padding: 2px 6px;
    border-radius: 4px;
  }
}

/* Breakpoint 2: Tablets & Medium Screens (601px - 860px) */
@media (min-width: 601px) and (max-width: 860px) {
  #grid {
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
    padding: 12px 14px 30px;
  }
  .card {
    border-radius: 8px;
  }
  .card .t {
    padding: 6px 7px 2px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card .m {
    padding: 0 7px 7px;
    font-size: 10px;
  }
  .card-badges {
    top: 6px;
    left: 6px;
    gap: 3px;
  }
  .card-badges .badge {
    font-size: 8.5px;
    padding: 2px 5px;
    border-radius: 4px;
  }
  .badge {
    top: 6px;
    left: 6px;
    font-size: 8.5px;
    padding: 2px 5px;
    border-radius: 4px;
  }
  .badge-series {
    top: 6px;
    right: 6px;
    font-size: 8px;
    padding: 1.5px 5px;
    border-radius: 4px;
  }
}

/* Breakpoint 3: Mobile Screens (<= 600px) - Render Small 3 Cards Default, No Horizontal Scroll */
@media (max-width: 600px) {
  header {
    flex-direction: column;
    align-items: stretch;
    padding: 8px 10px;
    gap: 7px;
  }
  .header-top-row {
    width: 100%;
    justify-content: space-between;
    gap: 6px;
  }
  h1 {
    font-size: 17px;
  }
  .header-controls {
    gap: 5px;
  }
  select {
    padding: 5px 6px;
    font-size: 11.5px;
    border-radius: 6px;
    max-width: 95px;
    height: 31px;
  }
  .btn-density {
    display: inline-flex;
    height: 31px;
    padding: 0 7px;
    font-size: 11px;
  }
  .search-wrap {
    width: 100%;
    max-width: 100%;
  }
  #q {
    padding: 7px 28px 7px 30px;
    font-size: 13px;
    border-radius: 6px;
    height: 34px;
  }
  .search-ico {
    left: 9px;
    width: 14px;
    height: 14px;
  }

  .filter-bar {
    padding: 8px 10px 4px;
    gap: 5px;
  }
  .pill {
    padding: 5px 11px;
    font-size: 11.5px;
    border-radius: 14px;
  }

  /* Default 3-column compact layout on mobile: fits cleanly within viewport */
  #grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    padding: 8px 8px 24px;
  }
  .card {
    border-radius: 7px;
  }
  .card .t {
    padding: 5px 5px 2px;
    font-size: 10.5px;
    font-weight: 600;
    line-height: 1.22;
    height: 2.45em;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .card .m {
    padding: 0 5px 5px;
    font-size: 9px;
  }
  .card-badges {
    top: 5px;
    left: 5px;
    gap: 3px;
  }
  .card-badges .badge {
    font-size: 8px;
    padding: 1.5px 4.5px;
    border-radius: 3px;
  }
  .badge-dub .dub-txt-short { display: inline; }
  .badge-dub .dub-txt-full { display: none; }
  .badge {
    top: 5px;
    left: 5px;
    font-size: 8px;
    padding: 1.5px 4.5px;
    border-radius: 3px;
  }
  .badge-series {
    top: 5px;
    right: 5px;
    font-size: 7.5px;
    padding: 1px 4px;
    border-radius: 3px;
  }

  /* Optional 2-column mode when toggled by user on mobile */
  #grid.cols-2 {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 10px;
    padding: 10px 10px 24px;
  }
  #grid.cols-2 .card {
    border-radius: 8px;
  }
  #grid.cols-2 .card .t {
    font-size: 12px;
    padding: 6px 7px 3px;
    height: 2.5em;
  }
  #grid.cols-2 .card .m {
    font-size: 10.5px;
    padding: 0 7px 7px;
  }
  #grid.cols-2 .card-badges .badge,
  #grid.cols-2 .badge {
    font-size: 9px;
    padding: 2px 6px;
  }
  #grid.cols-2 .badge-dub .dub-txt-short { display: none; }
  #grid.cols-2 .badge-dub .dub-txt-full { display: inline; }
}

/* Breakpoint 4: Ultra-narrow screens (<= 330px) */
@media (max-width: 330px) {
  #grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    padding: 6px 6px 20px;
  }
  .card-badges {
    top: 4px;
    left: 4px;
    gap: 2px;
  }
  .card-badges .badge {
    font-size: 7.5px;
    padding: 1px 3.5px;
  }
}

/* Enhanced Pagination System */
#pager {
  display: flex;
  gap: 6px;
  justify-content: center;
  align-items: center;
  padding: 14px 12px 42px;
  flex-wrap: wrap;
  width: 100%;
  box-sizing: border-box;
}
#pager button {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--txt);
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: .15s;
  min-width: 36px;
  user-select: none;
}
#pager button:hover:not(:disabled) {
  background: var(--card-hover);
  border-color: var(--accent);
}
#pager button.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 700;
}
#pager button:disabled {
  opacity: 0.35;
  cursor: default;
}
.pager-ellipsis {
  padding: 0 4px;
  color: var(--dim);
  user-select: none;
}
.pager-info {
  font-size: 12px;
  color: var(--dim);
  margin-left: 10px;
  user-select: none;
}
.pager-mobile-indicator {
  font-size: 12px;
  font-weight: 600;
  color: var(--dim);
  padding: 0 6px;
  user-select: none;
}

@media (max-width: 600px) {
  #pager {
    padding: 10px 8px 36px;
    gap: 6px;
  }
  #pager button {
    padding: 7px 11px;
    font-size: 12px;
    min-width: 32px;
    border-radius: 6px;
  }
  .pager-info {
    width: 100%;
    text-align: center;
    margin-left: 0;
    margin-top: 6px;
    font-size: 11px;
  }
}

/* Video Player Overlay Modal */
#overlay {
  position: fixed;
  inset: 0;
  background: rgba(8, 9, 12, 0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 40;
  display: none;
  flex-direction: column;
  padding: 16px;
  overflow-y: auto;
  overflow-x: hidden;
  box-sizing: border-box;
  width: 100%;
  max-width: 100vw;
}
#overlay.on {
  display: flex;
}
.box {
  max-width: 1100px;
  margin: auto;
  width: 100%;
  box-sizing: border-box;
}
.player-container {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 16px 48px rgba(0,0,0,0.85);
}
video {
  width: 100%;
  height: 100%;
  display: block;
  background: #000;
}
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 10px 0;
  flex-wrap: wrap;
  gap: 8px;
}
.row h2 {
  margin: 0;
  font-size: 18px;
  word-break: break-word;
}
.btn-group {
  display: flex;
  gap: 7px;
  align-items: center;
  flex-wrap: wrap;
}
button.btn-action {
  background: var(--card);
  border: 1px solid var(--border);
  color: #fff;
  padding: 7px 12px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: 600;
  font-size: 12.5px;
  transition: .15s;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
button.btn-action:hover {
  background: var(--card-hover);
  border-color: #3e4350;
}
button.btn-action:active {
  transform: scale(0.97);
}
button.btn-close {
  background: var(--accent);
  border: 0;
  color: #fff;
  padding: 8px 14px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  transition: .15s;
}
button.btn-close:hover {
  background: #ff9359;
}
button.btn-retry {
  background: #242732;
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 5px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  margin-left: 10px;
}
button.btn-retry:hover {
  background: var(--accent);
  color: #fff;
}

@media (max-width: 600px) {
  #overlay {
    padding: 8px 8px 24px;
  }
  .row {
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    margin: 6px 0 10px;
  }
  .row h2 {
    font-size: 15px;
    line-height: 1.3;
  }
  .btn-group {
    width: 100%;
    display: flex;
    justify-content: flex-start;
    gap: 5px;
  }
  button.btn-action {
    flex: 1 1 auto;
    padding: 6px 8px;
    font-size: 11px;
    justify-content: center;
  }
  button.btn-close {
    padding: 6px 12px;
    font-size: 11.5px;
    margin-left: auto;
  }
}

.status-wrap {
  display: flex;
  align-items: center;
  margin-top: 10px;
  min-height: 24px;
  flex-wrap: wrap;
  gap: 8px;
}
.status {
  color: var(--dim);
  font-size: 12.5px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.spinner {
  display: inline-block;
  width: 13px;
  height: 13px;
  border: 2px solid rgba(255,255,255,0.2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
  flex-shrink: 0;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.syn {
  color: var(--dim);
  max-width: 70ch;
  margin-top: 10px;
  font-size: 12.5px;
  line-height: 1.5;
}
footer {
  color: #666;
  font-size: 11.5px;
  padding: 0 14px 28px;
  text-align: center;
  word-break: break-word;
}

/* Floating HUD badge for skip/volume/subtitle feedback */
#player-hud {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%) scale(0.85);
  background: rgba(14,15,19,0.88);
  backdrop-filter: blur(10px);
  color: #fff;
  font-size: 20px;
  font-weight: 700;
  padding: 12px 24px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.18);
  box-shadow: 0 12px 36px rgba(0,0,0,0.7);
  pointer-events: none;
  opacity: 0;
  transition: opacity .15s, transform .15s;
  z-index: 30;
}
#player-hud.show {
  opacity: 1;
  transform: translate(-50%,-50%) scale(1);
}

/* Modern Subtitles / WebVTT Cue Styling */
::cue {
  background-color: rgba(0, 0, 0, 0.85);
  color: #ffffff;
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 17px;
  font-weight: 600;
  line-height: 1.4;
  text-shadow: 0 2px 4px #000;
  border-radius: 6px;
  padding: 3px 8px;
}
</style>
</head>
<body>
<header>
  <div class="header-top-row">
    <h1 onclick="goHome()" title="Go to Home (Newly Added)">CineMyMovies</h1>
    <div class="header-controls">
      <select id="source-filter" title="Filter by source" onchange="activeSource=this.value; page=1; syncFilterPills(document.getElementById('kind').value, activeGenre, this.value); load();">
        <option value="" selected>🌐 All Sources</option>
        <option value="yomovies">🎬 ym</option>

<!-- Quick Category / Genre / Source Pill Filter Bar (Horizontally scrollable with touch) -->
<nav class="filter-bar" id="filter-bar">

  <button class="pill" data-kind="" data-genre="" data-source="yomovies" onclick="setQuickFilter('', '', 'yomovies')" style="border-color:#3b82f6;color:#60a5fa;font-weight:700;">🎬 ym</button>
  <span class="pill-divider"></span>
  <button class="pill" data-kind="" data-genre="Hollywood Dubbed" data-source="" onclick="setQuickFilter('', 'Hollywood Dubbed', '')" style="border-color:#059669;color:#34d399;font-weight:700;">🎙️ Hindi Dubbed</button>

<div id="grid"></div>
<div id="pager"></div>
<footer>cinemymovies stores no media files; it indexes third-party embeds. &middot; Movie information and artwork from TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>

<div id="overlay">
  <div class="box">
    <div class="row">
      <h2 id="p-title"></h2>
      <div class="btn-group">
        <button id="btn-rewind" class="btn-action" onclick="handleSkip(-1)" title="Rewind 10s (Left Arrow / Click)">⏪ -10s</button>

      </div>
    </div>

<script>
const grid = document.getElementById('grid'), pager = document.getElementById('pager');
const overlay = document.getElementById('overlay'), video = document.getElementById('v');
const statusEl = document.getElementById('p-status'), hudEl = document.getElementById('player-hud');
const retryWrap = document.getElementById('retry-wrap');
const playerContainer = document.getElementById('player-container');
const pIframe = document.getElementById('p-iframe');

let page = 1, totalPages = 1, hls = null, curId = null, refreshing = false, keepTime = 0;
let skipAccumulator = 0, skipResetTimer = null, hudTimer = null, stallCheckTimer = null;
let currentStreamAbort = null, currentResolveSeq = 0;
let activeGenre = '';
let lastTotal = 0, lastPerPage = 48;

/* Configurable Backend API Endpoint (Supports static CDN hosts like Netlify/Vercel) */
const API_BASE = (window.API_BASE || localStorage.getItem('cm_api_base') || '').replace(/\/+$/, '');

function saveApiBase(){
  const inp = document.getElementById('api-base-input');
  if(!inp) return;
  const val = inp.value.trim().replace(/\/+$/, '');
  if(!val){
    localStorage.removeItem('cm_api_base');
  } else {
    localStorage.setItem('cm_api_base', val);
  }
  window.location.reload();
}
window.saveApiBase = saveApiBase;

/* Mobile Column Density Mode (3 compact cards default, 2 cards option) */
let mobileCols = localStorage.getItem('cm_mobile_cols') || '3';

function applyDensity(cols){
  mobileCols = cols;
  localStorage.setItem('cm_mobile_cols', cols);
  const iconEl = document.getElementById('density-icon');
  if(cols === '2'){
    grid.classList.add('cols-2');
    if(iconEl) iconEl.textContent = '📱 2';
  } else {
    grid.classList.remove('cols-2');
    if(iconEl) iconEl.textContent = '📱 3';
  }
}

function toggleDensity(){
  applyDensity(mobileCols === '3' ? '2' : '3');
}

applyDensity(mobileCols);

const esc = s => String(s == null ? '' : s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

/* Clicking CineMyMovies title goes to Home page 1, Newly Added */
function goHome(){
  closePlayer();
  closeDropdown();
  page = 1;
  activeGenre = '';
  activeSource = '';
  const sf = document.getElementById('source-filter');
  if(sf) sf.value = '';
  document.getElementById('q').value = '';
  const clr = document.getElementById('q-clear');
  if(clr) clr.style.display = 'none';
  document.getElementById('sort').value = 'recent';
  document.getElementById('kind').value = '';
  syncFilterPills('', '', '');
  window.scrollTo({top: 0, behavior: 'smooth'});
  load();
}

let activeSource = '';

/* Quick Filter Pills (All, Ask4Movie, YoMovies, Movies, Series, Bollywood, Hollywood...) */
function setQuickFilter(kindVal, genreVal, sourceVal = ''){
  closePlayer();
  document.getElementById('kind').value = kindVal;
  activeGenre = genreVal;
  activeSource = sourceVal;
  const srcSelect = document.getElementById('source-filter');
  if(srcSelect) srcSelect.value = sourceVal;
  page = 1;
  syncFilterPills(kindVal, genreVal, sourceVal);
  load();
}

function syncFilterPills(kindVal, genreVal, sourceVal = ''){
  document.querySelectorAll('.filter-bar .pill').forEach(btn => {
    const k = btn.getAttribute('data-kind') || '';
    const g = btn.getAttribute('data-genre') || '';
    const s = btn.getAttribute('data-source') || '';
    if (k === (kindVal || '') && g === (genreVal || '') && s === (sourceVal || '')) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });
}

/* Enhanced Pagination Navigation */
function gotoPage(p){
  const target = parseInt(p, 10);
  if(!target || isNaN(target) || target < 1) return;
  page = target;
  window.scrollTo({top: 0, behavior: 'smooth'});
  load();
}
window.gotoPage = gotoPage;
window.go = gotoPage;

function renderPager(total, perPage, curPage){
  totalPages = Math.max(1, Math.ceil(total / perPage));
  curPage = Math.max(1, Math.min(totalPages, curPage));
  let html = '';

  const isMobile = window.innerWidth <= 600;

  // Prev button
  html += `<button ${curPage <= 1 ? 'disabled' : ''} onclick="gotoPage(${curPage - 1})" aria-label="Previous page">‹ Prev</button>`;

  if (isMobile) {
    // Ultra-clean mobile indicator that never overflows
    html += `<span class="pager-mobile-indicator">Page ${curPage} of ${totalPages}</span>`;
  } else {
    // Desktop multi-page buttons
    if (totalPages <= 7) {
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="${i === curPage ? 'active' : ''}" onclick="gotoPage(${i})">${i}</button>`;
      }
    } else {
      html += `<button class="${curPage === 1 ? 'active' : ''}" onclick="gotoPage(1)">1</button>`;
      if (curPage > 3) html += `<span class="pager-ellipsis">…</span>`;

      const start = Math.max(2, curPage - 1);
      const end = Math.min(totalPages - 1, curPage + 1);
      for (let i = start; i <= end; i++) {
        html += `<button class="${i === curPage ? 'active' : ''}" onclick="gotoPage(${i})">${i}</button>`;
      }

      if (curPage < totalPages - 2) html += `<span class="pager-ellipsis">…</span>`;
      html += `<button class="${curPage === totalPages ? 'active' : ''}" onclick="gotoPage(${totalPages})">${totalPages}</button>`;
    }
  }

  // Next button
  html += `<button ${curPage >= totalPages ? 'disabled' : ''} onclick="gotoPage(${curPage + 1})" aria-label="Next page">Next ›</button>`;

  // Informative counter
  html += `<span class="pager-info">${total.toLocaleString()} titles</span>`;

  pager.innerHTML = html;
}

window.addEventListener('resize', ()=>{
  if(lastTotal > 0) renderPager(lastTotal, lastPerPage, page);
});

async function load(){
  grid.classList.add('loading');
  const p = new URLSearchParams({
    page,
    per_page: 48,
    sort: document.getElementById('sort').value
  });
  const src = document.getElementById('source-filter')?.value || activeSource || '';
  if(src) p.set('source', src);
  const q = document.getElementById('q').value.trim(); if(q) p.set('q',q);
  const k = document.getElementById('kind').value; if(k!=='') p.set('series',k);
  if(activeGenre) p.set('genre', activeGenre);

  try {
    const res = await fetch(API_BASE + '/api/movies?' + p);
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }
    const d = await res.json();
    lastTotal = d.total || 0;
    lastPerPage = d.per_page || 48;
    if(!window.movieCache) window.movieCache = new Map();
    (d.items || []).forEach(it => window.movieCache.set(it.id, it));

    grid.innerHTML = (d.items || []).map(m=>`
      <div class="card" onclick="openPlayer(${m.id})">
        <div class="card-badges">
          ${m.source==='ask4movie'
            ? '<span class="badge badge-ask">🍿 ask</span>'
            : '<span class="badge badge-ym">🎬 ym</span>'}
          ${m.is_hindi_dubbed
            ? '<span class="badge badge-dub" title="Hindi Dubbed"><span class="dub-icon">🎙️</span><span class="dub-txt-full"> Hindi Dubbed</span><span class="dub-txt-short"> Hindi</span></span>'
            : ''}
        </div>
        ${m.is_series?`<span class="badge-series">Series</span>`:''}
        <img loading="lazy" src="${esc(m.poster || m.poster_url)}" alt="" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22150%22 height=%22225%22 fill=%22%23222%22><rect width=%22100%%22 height=%22100%%22/></svg>'">
        <div class="t" title="${esc(m.title)}">${esc(m.title)}</div>
        <div class="m">
          <span>${esc(m.year||'')}${m.language ? ' · ' + esc(m.language) : ''}</span>
          <span>${m.imdb ? '★ ' + esc(m.imdb) : (m.rating ? '★ ' + esc(m.rating) : '')}</span>
        </div>
      </div>`).join('') || '<p style="padding:40px 20px;grid-column:1/-1;text-align:center;color:var(--dim)">No titles found in this category.</p>';

    renderPager(lastTotal, lastPerPage, d.page || page);
  } catch(e) {
    const isStaticDeploy = window.location.hostname.includes('netlify.app') || window.location.hostname.includes('vercel.app') || window.location.hostname.includes('github.io');
    grid.innerHTML = `
      <div style="padding:40px 16px;grid-column:1/-1;text-align:center;max-width:560px;margin:auto">
        <div style="font-size:36px;margin-bottom:12px">📡</div>
        <h3 style="color:#ff8888;margin:0 0 10px;font-size:18px">Backend API Not Connected</h3>
        <p style="color:var(--dim);font-size:13px;line-height:1.55;margin-bottom:18px">
          ${isStaticDeploy ? 
            '<strong>Netlify is a static CDN</strong> and cannot run Python/FastAPI servers, SQLite, or the video proxy.<br><br>Deploy this repository on <strong>Render.com</strong> or <strong>Railway.app</strong> (free 1-click Python hosting), or connect your deployed backend URL below:' : 
            'Unable to reach the Python/FastAPI backend at <code>' + (API_BASE || window.location.origin) + '</code>. Please check that your server is running.'}
        </p>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <input id="api-base-input" placeholder="https://your-api.onrender.com" value="${esc(API_BASE)}" style="background:var(--card);border:1px solid var(--border);color:#fff;padding:8px 12px;border-radius:6px;font-size:13px;min-width:260px;outline:none">
          <button onclick="saveApiBase()" style="background:var(--accent);border:0;color:#fff;padding:8px 16px;border-radius:6px;font-weight:600;cursor:pointer">Connect</button>
        </div>
      </div>`;
  } finally {
    grid.classList.remove('loading');
  }
}

/* HUD Feedback */
function showHud(text){
  if(!hudEl) return;
  hudEl.textContent = text;
  hudEl.classList.add('show');
  clearTimeout(hudTimer);
  hudTimer = setTimeout(()=>{ hudEl.classList.remove('show'); }, 850);
}

/* 10s Skip Handler with Instant Recovery (Never pauses or gets stuck) */
function handleSkip(direction){
  if(!video) return;
  const wasPlaying = !video.paused;

  if(direction > 0){
    if(skipAccumulator < 0) skipAccumulator = 0;
    skipAccumulator += 10;
  } else {
    if(skipAccumulator > 0) skipAccumulator = 0;
    skipAccumulator -= 10;
  }

  const duration = (video.duration && !isNaN(video.duration)) ? video.duration : 999999;
  const targetTime = Math.max(0, Math.min(duration - 1, video.currentTime + (direction * 10)));
  video.currentTime = targetTime;

  const text = skipAccumulator > 0 ? `⏩ +${skipAccumulator}s` : `⏪ ${skipAccumulator}s`;
  showHud(text);

  // Resume playback immediately if it was active
  if(wasPlaying){
    const p = video.play();
    if(p && typeof p.catch === 'function') p.catch(()=>{});
  }

  clearTimeout(skipResetTimer);
  skipResetTimer = setTimeout(()=>{ skipAccumulator = 0; }, 750);
}

// Double click left or right half of player to skip 10s
if(playerContainer){
  playerContainer.addEventListener('dblclick', (e)=>{
    if(e.target.tagName === 'BUTTON') return;
    const rect = playerContainer.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if(x < rect.width * 0.45){
      handleSkip(-1);
    } else if(x > rect.width * 0.55){
      handleSkip(1);
    }
  });
}

// Ensure smooth resume upon seeking / buffering
video.addEventListener('seeked', ()=>{
  clearTimeout(stallCheckTimer);
  if(!video.paused) return;
  stallCheckTimer = setTimeout(()=>{
    if(video.paused && overlay.classList.contains('on')){
      video.play().catch(()=>{});
    }
  }, 250);
});

video.addEventListener('waiting', ()=>{
  statusEl.innerHTML = `<span class="spinner"></span> Buffering…`;
});

video.addEventListener('playing', ()=>{
  if(curId) statusEl.textContent = `Playing title · Stream active`;
});

/* Toggle English Subtitles */
function toggleCC(){
  if(!video.textTracks || video.textTracks.length === 0){
    showHud('No Subtitles');
    return;
  }
  const track = video.textTracks[0];
  const isShowing = track.mode === 'showing';
  track.mode = isShowing ? 'hidden' : 'showing';
  const btn = document.getElementById('btn-cc');
  if(btn) btn.textContent = `CC: English (${isShowing ? 'OFF' : 'ON'})`;
  showHud(`Subtitles: ${isShowing ? 'OFF' : 'English'}`);
}

async function openPlayer(id){
  curId = id;
  overlay.classList.add('on');
  document.getElementById('p-title').innerHTML = '<span class="spinner" style="vertical-align:middle;margin-right:8px"></span> Loading…';
  document.getElementById('p-syn').textContent = '';
  const altWrap = document.getElementById('alt-source-wrap');
  if(altWrap) altWrap.style.display = 'none';
  if(retryWrap) retryWrap.style.display = 'none';
  const srvBox = document.getElementById('server-switcher');
  if(srvBox){ srvBox.innerHTML = ''; srvBox.style.display = 'none'; }

  if(hls){ hls.destroy(); hls = null; }
  video.removeAttribute('src'); video.load();
  if(pIframe){
    pIframe.style.display = 'none';
    pIframe.src = 'about:blank';
  }

  // Clear previous subtitle tracks and attach English track
  while(video.firstChild) video.removeChild(video.firstChild);
  const track = document.createElement('track');
  track.id = 'v-sub';
  track.kind = 'subtitles';
  track.label = 'English';
  track.srclang = 'en';
  track.src = (API_BASE || '') + `/api/subtitles/${id}`;
  track.default = true;
  video.appendChild(track);
  track.addEventListener('load', ()=>{
    if(video.textTracks && video.textTracks[0]) video.textTracks[0].mode = 'showing';
  });

  const renderMeta = (item) => {
    if(!item) return;
    const isAsk = item.source === 'ask4movie';
    const srcTag = isAsk
      ? '<span style="display:inline-block;margin-right:6px;padding:2px 8px;font-size:11px;font-weight:700;border-radius:4px;background:#ea580c;color:#fff;vertical-align:middle;">🍿 ask</span>'
      : '<span style="display:inline-block;margin-right:6px;padding:2px 8px;font-size:11px;font-weight:700;border-radius:4px;background:#1d4ed8;color:#fff;vertical-align:middle;">🎬 ym</span>';
    const dubTag = item.is_hindi_dubbed
      ? '<span style="display:inline-block;margin-right:8px;padding:2px 8px;font-size:11px;font-weight:700;border-radius:4px;background:#059669;color:#fff;vertical-align:middle;box-shadow:0 2px 6px rgba(5,150,105,0.4);">🎙️ Hindi Dubbed</span>'
      : '';
    const yr = item.year ? ` (${esc(item.year)})` : '';
    document.getElementById('p-title').innerHTML = `${srcTag} ${dubTag} ${esc(item.title || ('Movie #' + id))}${yr}`;
    document.getElementById('p-syn').textContent = item.synopsis || '';

    // Notice for upcoming unreleased titles (e.g. 2025, 2026)
    const isUpcoming = parseInt(item.year, 10) >= 2025;
    if(altWrap && isUpcoming){
      altWrap.innerHTML = `<span style="display:inline-block;padding:5px 12px;background:rgba(234,88,12,0.18);border:1px solid rgba(234,88,12,0.4);border-radius:8px;color:#ff9359;font-size:12px;font-weight:600;">ℹ️ Upcoming ${esc(item.year)} release. Stream availability depends on official theatrical/OTT release. Browse released titles (2024 & prior) for instant HD playback.</span>`;
      altWrap.style.display = 'block';
    } else if(altWrap && item.also_available_on && item.also_available_on.length > 0){
      // R14: Cross-source dedupe switcher ("also available on")
      const altsHtml = item.also_available_on.map(alt => {
        const altDub = alt.is_hindi_dubbed ? ' (🎙️ Hindi Dubbed)' : '';
        const altSrc = alt.source === 'ask4movie' ? '🍿 ask' : '🎬 ym';
        return `<button class="pill" style="display:inline-block;margin-left:6px;padding:3px 10px;font-size:11.5px;background:var(--card);border:1px solid var(--border);color:var(--txt);border-radius:12px;cursor:pointer;" onclick="openPlayer(${alt.id})">Switch to ${altSrc}${altDub}</button>`;
      }).join('');
      altWrap.innerHTML = `<span>Also available on:</span> ${altsHtml}`;
      altWrap.style.display = 'block';
    }
  };

  const cachedItem = window.movieCache?.get(id);
  if(cachedItem) renderMeta(cachedItem);

  fetch((API_BASE || '') + `/api/movie/${id}`)
    .then(r => r.ok ? r.json() : null)
    .then(fullItem => {
      if(fullItem && curId === id){
        if(!window.movieCache) window.movieCache = new Map();
        window.movieCache.set(id, fullItem);
        renderMeta(fullItem);
      }
    })
    .catch(()=>{
      if(!cachedItem){
        document.getElementById('p-title').textContent = `Movie #${id}`;
      }
    });

  const btnCC = document.getElementById('btn-cc');
  if(btnCC) btnCC.textContent = 'CC: English (ON)';

  await fetchStream(id);
}

async function fetchStream(id, fresh = false){
  const mySeq = ++currentResolveSeq;
  if(currentStreamAbort) currentStreamAbort.abort();
  currentStreamAbort = new AbortController();

  if(retryWrap) retryWrap.style.display = 'none';
  statusEl.innerHTML = `<span class="spinner"></span> Resolving stream from high-speed servers…`;

  // Timeout guard (16s)
  const timeoutId = setTimeout(()=>{
    if(mySeq === currentResolveSeq){
      if(currentStreamAbort) currentStreamAbort.abort();
      statusEl.innerHTML = `<span style="color:#ff9359">⚠️ Stream resolution is taking longer than usual.</span>`;
      if(retryWrap) retryWrap.style.display = 'block';
    }
  }, 16000);

  try {
    const res = await fetch(API_BASE + `/api/stream/${id}${fresh?'?fresh=1':''}`, {
      signal: currentStreamAbort.signal
    });
    clearTimeout(timeoutId);

    if(mySeq !== currentResolveSeq) return;

    if(!res.ok){
      const errData = await res.json().catch(()=>({}));
      throw new Error(errData.detail || `Server returned ${res.status}`);
    }

    const s = await res.json();
    if(mySeq !== currentResolveSeq) return;
    if(!s.play && !s.url) throw new Error('No playable stream found.');

    const playUrl = s.url || s.play;
    const kind = s.kind || (s.type === 'embed' ? 'iframe' : 'hls');

    const srvBox = document.getElementById('server-switcher');
    if(srvBox) srvBox.innerHTML = '';

    if(kind === 'iframe' || s.type === 'embed'){
      // External embed player (Ask4Movie iframe / Vidsrc)
      if(hls){ hls.destroy(); hls = null; }
      video.pause();
      video.style.display = 'none';
      if(pIframe){
        pIframe.style.display = 'block';
        pIframe.src = playUrl;
      }
      const rw = document.getElementById('btn-rewind'), fw = document.getElementById('btn-forward'), cc = document.getElementById('btn-cc');
      if(rw) rw.style.display = 'none';
      if(fw) fw.style.display = 'none';
      if(cc) cc.style.display = 'none';

      const firstServerLabel = (s.servers && s.servers.length > 0) ? s.servers[0].label : (s.host || 'HD');
      statusEl.textContent = `${firstServerLabel} · Active stream player ${s.cached ? '(cached)' : ''}`;

      // Server switcher pills
      if(srvBox && s.servers && s.servers.length > 1){
        s.servers.forEach((srv, idx) => {
          const btn = document.createElement('button');
          const isSelected = srv.url === playUrl || (!playUrl && idx === 0);
          btn.className = 'pill' + (isSelected ? ' active' : '');
          btn.textContent = srv.label || `Server ${idx + 1}`;
          btn.style.cssText = 'padding:4px 12px;font-size:12px;cursor:pointer;';
          btn.onclick = () => {
            pIframe.src = srv.url;
            srvBox.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            statusEl.textContent = `${srv.label || ('Server ' + (idx + 1))} · Active stream player`;
          };
          srvBox.appendChild(btn);
        });
        srvBox.style.display = 'flex';
      } else if(srvBox) {
        srvBox.style.display = 'none';
      }
    } else {
      // Native HLS player (YoMovies / Speedostream)
      if(pIframe){
        pIframe.style.display = 'none';
        pIframe.src = 'about:blank';
      }
      if(srvBox) srvBox.style.display = 'none';
      video.style.display = 'block';
      const rw = document.getElementById('btn-rewind'), fw = document.getElementById('btn-forward'), cc = document.getElementById('btn-cc');
      if(rw) rw.style.display = 'inline-flex';
      if(fw) fw.style.display = 'inline-flex';
      if(cc) cc.style.display = 'inline-flex';
      statusEl.textContent = `Server ${s.code || s.host || '1'} · Active token (${Math.round((s.expires_in||1800)/60)} min) ${s.cached ? '(cached)' : ''}`;
      attach(playUrl);
    }
  } catch(err) {
    clearTimeout(timeoutId);
    if(err.name === 'AbortError') return;
    if(mySeq !== currentResolveSeq) return;

    statusEl.innerHTML = `<span style="color:#ff8888">⚠️ ${esc(err.message || 'No playable stream for this title.')}</span>`;
    if(retryWrap) retryWrap.style.display = 'block';
  }
}

function retryStream(){
  if(curId) fetchStream(curId, true);
}

/* Silently renew token on fatal error */
async function selfHeal(){
  if(refreshing || !curId) return;
  refreshing = true;
  keepTime = video.currentTime;
  statusEl.innerHTML = `<span class="spinner"></span> Token refreshed — resuming playback…`;
  await fetchStream(curId, true);
  setTimeout(()=>{ refreshing = false; }, 1500);
}

function attach(url){
  if(url && url.startsWith('/') && API_BASE) url = API_BASE + url;
  if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src = url;
    video.play().catch(()=>{});
    video.onerror = ()=>selfHeal();
    return;
  }

  if(hls){ hls.destroy(); hls = null; }

  hls = new Hls({
    maxBufferLength: 30,
    maxMaxBufferLength: 60,
    backBufferLength: 30,
    enableWorker: true,
    lowLatencyMode: false,
    nudgeMaxRetry: 5,
    nudgeOffset: 0.2
  });

  hls.loadSource(url);
  hls.attachMedia(video);

  hls.on(Hls.Events.MANIFEST_PARSED, ()=>{
    if(keepTime > 1){
      video.currentTime = keepTime;
      keepTime = 0;
    }
    video.play().catch(()=>{});
  });

  hls.on(Hls.Events.ERROR, (_, data)=>{
    if(!data.fatal) return;
    if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
      console.warn('HLS Network error during seek/buffer, recovering...', data);
      hls.startLoad();
    } else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
      console.warn('HLS Media error, recovering...', data);
      hls.recoverMediaError();
    } else {
      console.warn('HLS fatal error, self-healing...', data);
      selfHeal();
    }
  });
}

function closePlayer(){
  overlay.classList.remove('on');
  if(currentStreamAbort){
    currentStreamAbort.abort();
    currentStreamAbort = null;
  }
  if(hls){ hls.destroy(); hls = null; }
  if(pIframe){
    pIframe.style.display = 'none';
    pIframe.src = 'about:blank';
  }
  const srvBox = document.getElementById('server-switcher');
  if(srvBox){ srvBox.innerHTML = ''; srvBox.style.display = 'none'; }
  video.pause();
  video.removeAttribute('src');
  video.load();
  video.style.display = 'block';
  const rw = document.getElementById('btn-rewind'), fw = document.getElementById('btn-forward'), cc = document.getElementById('btn-cc');
  if(rw) rw.style.display = 'inline-flex';
  if(fw) fw.style.display = 'inline-flex';
  if(cc) cc.style.display = 'inline-flex';
  curId = null;
  statusEl.innerHTML = '';
  if(retryWrap) retryWrap.style.display = 'none';
}

/* Pre-empt expiry every 25 min (TTL is 30) */
setInterval(()=>{ if(curId && overlay.classList.contains('on')) selfHeal(); }, 25*60*1000);

/* Keyboard and Remote Controls */
window.addEventListener('keydown', (e)=>{
  if(document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT')){
    if(e.key === 'Escape') document.activeElement.blur();
    return;
  }
  const isPlayerOpen = overlay.classList.contains('on');
  if(!isPlayerOpen) return;

  // Arrow Right or Remote FastForward / TrackNext -> Skip Forward 10s
  if(e.key === 'ArrowRight' || e.code === 'ArrowRight' || e.key === 'MediaFastForward' || e.key === 'MediaTrackNext' || e.keyCode === 39){
    e.preventDefault();
    handleSkip(1);
  }
  // Arrow Left or Remote Rewind / TrackPrevious -> Skip Backward 10s
  else if(e.key === 'ArrowLeft' || e.code === 'ArrowLeft' || e.key === 'MediaRewind' || e.key === 'MediaTrackPrevious' || e.keyCode === 37){
    e.preventDefault();
    handleSkip(-1);
  }
  // Arrow Up -> Volume Up (+10%)
  else if(e.key === 'ArrowUp' || e.keyCode === 38){
    e.preventDefault();
    video.volume = Math.min(1, Math.round((video.volume + 0.1) * 10) / 10);
    showHud(`🔊 Volume ${Math.round(video.volume * 100)}%`);
  }
  // Arrow Down -> Volume Down (-10%)
  else if(e.key === 'ArrowDown' || e.keyCode === 40){
    e.preventDefault();
    video.volume = Math.max(0, Math.round((video.volume - 0.1) * 10) / 10);
    showHud(`🔉 Volume ${Math.round(video.volume * 100)}%`);
  }
  // Space / 'k' / MediaPlayPause -> Toggle Play / Pause
  else if(e.key === ' ' || e.code === 'Space' || e.key === 'k' || e.key === 'K' || e.key === 'MediaPlayPause' || e.keyCode === 32){
    e.preventDefault();
    if(video.paused){
      video.play().catch(()=>{});
      showHud('▶ Play');
    } else {
      video.pause();
      showHud('⏸ Pause');
    }
  }
  // 'f' / 'F' -> Toggle Fullscreen
  else if(e.key === 'f' || e.key === 'F'){
    e.preventDefault();
    if(!document.fullscreenElement){
      video.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen().catch(()=>{});
    }
  }
  // 'm' / 'M' -> Toggle Mute
  else if(e.key === 'm' || e.key === 'M'){
    e.preventDefault();
    video.muted = !video.muted;
    showHud(video.muted ? '🔇 Muted' : '🔊 Unmuted');
  }
  // 'c' / 'C' -> Toggle Subtitles
  else if(e.key === 'c' || e.key === 'C'){
    e.preventDefault();
    toggleCC();
  }
  // Escape -> Close Player
  else if(e.key === 'Escape'){
    e.preventDefault();
    closePlayer();
  }
});

/* Search Bar Dropdown System across Movies */
const qInput = document.getElementById('q');
const qClear = document.getElementById('q-clear');
const searchDropdown = document.getElementById('search-dropdown');
let searchDebounceTimer = null;
let activeDropdownIdx = -1;

function clearSearch(){
  qInput.value = '';
  qClear.style.display = 'none';
  closeDropdown();
  page = 1;
  load();
  qInput.focus();
}

function closeDropdown(){
  searchDropdown.classList.remove('open');
  searchDropdown.innerHTML = '';
  activeDropdownIdx = -1;
}

async function renderSearchDropdown(query){
  if(!query || !query.trim()){
    closeDropdown();
    qClear.style.display = 'none';
    return;
  }
  qClear.style.display = 'block';

  try {
    const res = await fetch(API_BASE + `/api/search?q=${encodeURIComponent(query.trim())}&limit=8`);
    const data = await res.json();
    if(!searchDropdown) return;
    if(data.items && data.items.length > 0){
      if(!window.movieCache) window.movieCache = new Map();
      data.items.forEach(it => window.movieCache.set(it.id, it));
    }

    if(!data.items || data.items.length === 0){
      searchDropdown.innerHTML = `<div class="s-empty">No titles found matching "${esc(query)}".</div>`;
      searchDropdown.classList.add('open');
      return;
    }

    let html = data.items.map((m, idx)=>`
      <div class="s-item" data-idx="${idx}" onclick="selectSearchMovie(${m.id})">
        <img class="s-thumb" src="${esc(m.poster)}" loading="lazy" alt="" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2238%22 height=%2254%22 fill=%22%23222%22><rect width=%22100%%22 height=%22100%%22/></svg>'">
        <div class="s-info">
          <div class="s-title">${esc(m.title)}</div>
          <div class="s-meta">
            ${m.year?`<span>${esc(m.year)}</span>`:''}
            ${m.quality?`<span class="s-badge">${esc(m.quality)}</span>`:''}
            ${m.imdb?`<span>★ ${esc(m.imdb)}</span>`:''}
            <span>${m.is_series?'Series':'Movie'}</span>
          </div>
        </div>
      </div>
    `).join('');

    html += `<div class="s-footer" onclick="viewAllSearchResults('${esc(query)}')">
      🔍 View all ${data.total.toLocaleString()} matching titles in grid →
    </div>`;

    searchDropdown.innerHTML = html;
    searchDropdown.classList.add('open');
    activeDropdownIdx = -1;
  } catch(e) {
    console.error(e);
  }
}

function selectSearchMovie(id){
  closeDropdown();
  openPlayer(id);
}

function viewAllSearchResults(query){
  closeDropdown();
  qInput.value = query;
  page = 1;
  load();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// Live input listener: instant dropdown + grid update
qInput.addEventListener('input', ()=>{
  const val = qInput.value.trim();
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(()=>{
    renderSearchDropdown(val);
    page = 1;
    load();
  }, 130);
});

// Re-open dropdown on focus if input has value
qInput.addEventListener('focus', ()=>{
  if(qInput.value.trim()) renderSearchDropdown(qInput.value.trim());
});

// Click outside closes dropdown
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.search-wrap')){
    closeDropdown();
  }
});

// Keyboard navigation in search bar (ArrowDown, ArrowUp, Enter, Escape)
qInput.addEventListener('keydown', (e)=>{
  const items = searchDropdown.querySelectorAll('.s-item');
  if(!searchDropdown.classList.contains('open') || items.length === 0){
    if(e.key === 'Enter'){
      closeDropdown();
      page = 1;
      load();
    }
    return;
  }

  if(e.key === 'ArrowDown'){
    e.preventDefault();
    activeDropdownIdx = (activeDropdownIdx + 1) % items.length;
    highlightItem(items);
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    activeDropdownIdx = (activeDropdownIdx - 1 + items.length) % items.length;
    highlightItem(items);
  } else if(e.key === 'Enter'){
    e.preventDefault();
    if(activeDropdownIdx >= 0 && items[activeDropdownIdx]){
      items[activeDropdownIdx].click();
    } else {
      viewAllSearchResults(qInput.value.trim());
    }
  } else if(e.key === 'Escape'){
    closeDropdown();
  }
});

function highlightItem(items){
  items.forEach((it, i)=>{
    if(i === activeDropdownIdx){
      it.classList.add('active');
      it.scrollIntoView({block:'nearest'});
    } else {
      it.classList.remove('active');
    }
  });
}

// Change event listeners on selects
document.getElementById('sort').addEventListener('change', ()=>{ page=1; load(); });
document.getElementById('kind').addEventListener('change', ()=>{
  page=1;
  syncFilterPills(document.getElementById('kind').value, activeGenre);
  load();
});

load();
</script>
