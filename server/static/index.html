<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyMovies</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
:root{--bg:#0e0f13;--card:#1a1c22;--accent:#ff7b39;--txt:#e8e8ea;--dim:#9aa0aa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;
  padding:14px 18px;background:#0e0f13ee;backdrop-filter:blur(8px)}
h1{font-size:20px;margin:0;color:var(--accent);cursor:pointer;user-select:none;transition:transform .15s}
h1:hover{transform:scale(1.04)}
input,select{background:var(--card);border:1px solid #2a2d35;color:var(--txt);
  padding:9px 12px;border-radius:8px;outline:none}
input{flex:1;max-width:360px}
#grid{display:grid;gap:14px;padding:18px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{position:relative;background:var(--card);border-radius:10px;overflow:hidden;
  cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px #0008}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#222}
.card .t{padding:8px 10px;font-size:13px;font-weight:600}
.card .m{padding:0 10px 10px;font-size:11px;color:var(--dim);display:flex;justify-content:space-between}
.badge{position:absolute;top:8px;left:8px;background:#000a;color:var(--accent);
  padding:2px 7px;border-radius:5px;font-size:10px}
#pager{display:flex;gap:8px;justify-content:center;padding:10px 0 44px}
#pager button{background:var(--card);border:1px solid #2a2d35;color:var(--txt);
  padding:8px 14px;border-radius:8px;cursor:pointer}
#overlay{position:fixed;inset:0;background:#000d;z-index:20;display:none;
  flex-direction:column;padding:18px;overflow:auto}
#overlay.on{display:flex}
.box{max-width:1100px;margin:auto;width:100%}
.player-container{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
video{width:100%;height:100%;display:block;background:#000}
.row{display:flex;justify-content:space-between;align-items:center;margin:12px 0;flex-wrap:wrap;gap:10px}
.row h2{margin:0;font-size:20px}
.btn-group{display:flex;gap:8px;align-items:center}
button.btn-action{background:var(--card);border:1px solid #2a2d35;color:#fff;padding:8px 14px;
  border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;transition:.15s}
button.btn-action:hover{background:#2a2d35}
button.btn-close{background:var(--accent);border:0;color:#fff;padding:9px 16px;
  border-radius:8px;cursor:pointer;font-weight:600}
.status{color:var(--dim);font-size:13px;min-height:20px}
.syn{color:var(--dim);max-width:70ch}
footer{color:#666;font-size:12px;padding:0 18px 30px;text-align:center}

/* Floating HUD badge for skip/volume/subtitle feedback */
#player-hud{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.85);
  background:rgba(14,15,19,0.88);backdrop-filter:blur(10px);color:#fff;font-size:22px;
  font-weight:700;padding:14px 26px;border-radius:14px;border:1px solid rgba(255,255,255,0.18);
  box-shadow:0 12px 36px rgba(0,0,0,0.7);pointer-events:none;opacity:0;transition:opacity .15s,transform .15s;z-index:30}
#player-hud.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* Modern Subtitles / WebVTT Cue Styling */
::cue {
  background-color: rgba(0, 0, 0, 0.85);
  color: #ffffff;
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 19px;
  font-weight: 600;
  line-height: 1.4;
  text-shadow: 0 2px 4px #000;
  border-radius: 6px;
  padding: 3px 8px;
}
</style>
</head>
<body>
<header>
  <h1 onclick="goHome()" title="Go to Home (Newest release)">MyMovies</h1>
  <input id="q" placeholder="Search title…">
  <select id="sort">
    <option value="year" selected>Newest release</option>
    <option value="recent">Newest added</option>
    <option value="imdb">Top IMDb</option>
    <option value="title">A → Z</option>
  </select>
  <select id="kind">
    <option value="">Movies + Series</option>
    <option value="0">Movies only</option>
    <option value="1">Series only</option>
  </select>
</header>

<div id="grid"></div>
<div id="pager"></div>
<footer>Personal streaming front-end · metadata &amp; streams sourced from upstream · not affiliated</footer>

<div id="overlay">
  <div class="box">
    <div class="row">
      <h2 id="p-title"></h2>
      <div class="btn-group">
        <button id="btn-cc" class="btn-action" onclick="toggleCC()" title="Toggle English Subtitles (Press C)">CC: English (ON)</button>
        <button class="btn-close" onclick="closePlayer()">Close</button>
      </div>
    </div>
    <div class="player-container">
      <video id="v" controls playsinline crossorigin="anonymous"></video>
      <div id="player-hud"></div>
    </div>
    <div class="status" id="p-status"></div>
    <p class="syn" id="p-syn"></p>
  </div>
</div>

<script>
const grid=document.getElementById('grid'), pager=document.getElementById('pager');
const overlay=document.getElementById('overlay'), video=document.getElementById('v');
const statusEl=document.getElementById('p-status'), hudEl=document.getElementById('player-hud');
let page=1, hls=null, curId=null, refreshing=false, keepTime=0;
let skipAccumulator=0, skipResetTimer=null, hudTimer=null;

const esc=s=>(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

/* Requirement 2: Clicking MyMovies title goes to Home page 1, Newest release */
function goHome(){
  closePlayer();
  page=1;
  document.getElementById('q').value='';
  document.getElementById('sort').value='year';
  document.getElementById('kind').value='';
  scrollTo(0,0);
  load();
}

async function load(){
  const p=new URLSearchParams({page,per_page:48,sort:document.getElementById('sort').value});
  const q=document.getElementById('q').value.trim(); if(q) p.set('q',q);
  const k=document.getElementById('kind').value; if(k!=='') p.set('series',k);
  const d=await (await fetch('/api/movies?'+p)).json();
  grid.innerHTML=d.items.map(m=>`
    <div class="card" onclick="openPlayer(${m.id})">
      ${m.quality?`<span class="badge">${esc(m.quality)}</span>`:''}
      <img loading="lazy" src="${esc(m.poster)}" alt="">
      <div class="t">${esc(m.title)}</div>
      <div class="m"><span>${esc(m.year||'')}</span><span>${m.imdb?'★ '+esc(m.imdb):''}</span></div>
    </div>`).join('')||'<p style="padding:20px">No results.</p>';
  const pages=Math.max(1,Math.ceil(d.total/d.per_page));
  pager.innerHTML=`<button ${page<=1?'disabled':''} onclick="go(${page-1})">‹ Prev</button>
    <button disabled>Page ${page} / ${pages} — ${d.total} titles</button>
    <button ${page>=pages?'disabled':''} onclick="go(${page+1})">Next ›</button>`;
}
function go(p){page=p;scrollTo(0,0);load();}

/* Requirement 1: HUD feedback & 10s per click accumulator */
function showHud(text){
  if(!hudEl) return;
  hudEl.textContent=text;
  hudEl.classList.add('show');
  clearTimeout(hudTimer);
  hudTimer=setTimeout(()=>{ hudEl.classList.remove('show'); }, 850);
}

function handleSkip(direction){
  if(direction > 0){
    if(skipAccumulator < 0) skipAccumulator = 0;
    skipAccumulator += 10;
  } else {
    if(skipAccumulator > 0) skipAccumulator = 0;
    skipAccumulator -= 10;
  }

  const duration = video.duration || 999999;
  video.currentTime = Math.max(0, Math.min(duration - 1, video.currentTime + (direction * 10)));

  const text = skipAccumulator > 0 ? `⏩ +${skipAccumulator}s` : `⏪ ${skipAccumulator}s`;
  showHud(text);

  clearTimeout(skipResetTimer);
  skipResetTimer = setTimeout(()=>{ skipAccumulator = 0; }, 750);
}

/* Requirement 3: Toggle English Subtitles */
function toggleCC(){
  if(!video.textTracks || video.textTracks.length === 0){
    showHud('No Subtitles');
    return;
  }
  const track = video.textTracks[0];
  const isShowing = track.mode === 'showing';
  track.mode = isShowing ? 'hidden' : 'showing';
  const btn = document.getElementById('btn-cc');
  if(btn) btn.textContent = `CC: English (${isShowing ? 'OFF' : 'ON'})`;
  showHud(`Subtitles: ${isShowing ? 'OFF' : 'English'}`);
}

async function openPlayer(id){
  curId=id; overlay.classList.add('on');
  document.getElementById('p-title').textContent='Loading…';
  document.getElementById('p-syn').textContent='';
  statusEl.textContent='Resolving stream…';
  if(hls){hls.destroy();hls=null;}
  video.removeAttribute('src'); video.load();

  // Clear previous subtitle tracks and attach English track
  while(video.firstChild) video.removeChild(video.firstChild);
  const track = document.createElement('track');
  track.id = 'v-sub';
  track.kind = 'subtitles';
  track.label = 'English';
  track.srclang = 'en';
  track.src = `/api/subtitles/${id}`;
  track.default = true;
  video.appendChild(track);
  track.addEventListener('load', ()=>{
    if(video.textTracks && video.textTracks[0]) video.textTracks[0].mode = 'showing';
  });

  const m=await (await fetch('/api/movie/'+id)).json();
  document.getElementById('p-title').textContent=`${m.title} ${m.year?'('+m.year+')':''}`;
  document.getElementById('p-syn').textContent=m.synopsis||'';
  const btnCC = document.getElementById('btn-cc');
  if(btnCC) btnCC.textContent = 'CC: English (ON)';

  await fetchStream(id);
}

async function fetchStream(id, fresh){
  try{
    const s=await (await fetch(`/api/stream/${id}${fresh?'?fresh=1':''}`)).json();
    if(!s.play) throw 0;
    statusEl.textContent=`Server ${s.code} · fresh token (${Math.round(s.expires_in/60)} min)`;
    attach(s.play);
  }catch(e){ statusEl.textContent='No playable stream for this title.'; }
}

/* R2: on fatal error, silently get a NEW token and resume at same second */
async function selfHeal(){
  if(refreshing) return; refreshing=true;
  keepTime=video.currentTime;
  statusEl.textContent='Token expired — refreshing…';
  await fetchStream(curId, true);
  setTimeout(()=>{refreshing=false;},1500);
}

function attach(url){
  if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src=url; video.play().catch(()=>{});
    video.onerror=()=>selfHeal();
    return;
  }
  hls=new Hls({maxBufferLength:30, lowLatencyMode:false});
  hls.loadSource(url); hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED,()=>{
    if(keepTime>1){video.currentTime=keepTime;keepTime=0;}
    video.play().catch(()=>{});
  });
  hls.on(Hls.Events.ERROR,(_,d)=>{
    if(!d.fatal) return;
    if(d.type===Hls.ErrorTypes.MEDIA_ERROR){hls.recoverMediaError();}
    else {selfHeal();}
  });
}

function closePlayer(){
  overlay.classList.remove('on');
  if(hls){hls.destroy();hls=null;}
  video.pause();video.removeAttribute('src');video.load();
}

/* R2: pre-empt expiry every 25 min (TTL is 30) */
setInterval(()=>{ if(curId && overlay.classList.contains('on')) selfHeal(); }, 25*60*1000);

/* Keyboard and Remote Controls */
window.addEventListener('keydown', (e)=>{
  if(document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT')){
    if(e.key === 'Escape') document.activeElement.blur();
    return;
  }
  const isPlayerOpen = overlay.classList.contains('on');
  if(!isPlayerOpen) return;

  // Arrow Right or Remote FastForward / TrackNext -> Skip Forward (+10s, +20s, +30s...)
  if(e.key === 'ArrowRight' || e.code === 'ArrowRight' || e.key === 'MediaFastForward' || e.key === 'MediaTrackNext' || e.keyCode === 39){
    e.preventDefault();
    handleSkip(1);
  }
  // Arrow Left or Remote Rewind / TrackPrevious -> Skip Backward (-10s, -20s, -30s...)
  else if(e.key === 'ArrowLeft' || e.code === 'ArrowLeft' || e.key === 'MediaRewind' || e.key === 'MediaTrackPrevious' || e.keyCode === 37){
    e.preventDefault();
    handleSkip(-1);
  }
  // Arrow Up -> Volume Up (+10%)
  else if(e.key === 'ArrowUp' || e.keyCode === 38){
    e.preventDefault();
    video.volume = Math.min(1, Math.round((video.volume + 0.1) * 10) / 10);
    showHud(`🔊 Volume ${Math.round(video.volume * 100)}%`);
  }
  // Arrow Down -> Volume Down (-10%)
  else if(e.key === 'ArrowDown' || e.keyCode === 40){
    e.preventDefault();
    video.volume = Math.max(0, Math.round((video.volume - 0.1) * 10) / 10);
    showHud(`🔉 Volume ${Math.round(video.volume * 100)}%`);
  }
  // Space / 'k' / MediaPlayPause -> Toggle Play / Pause
  else if(e.key === ' ' || e.code === 'Space' || e.key === 'k' || e.key === 'K' || e.key === 'MediaPlayPause' || e.keyCode === 32){
    e.preventDefault();
    if(video.paused){
      video.play().catch(()=>{});
      showHud('▶ Play');
    } else {
      video.pause();
      showHud('⏸ Pause');
    }
  }
  // 'f' / 'F' -> Toggle Fullscreen
  else if(e.key === 'f' || e.key === 'F'){
    e.preventDefault();
    if(!document.fullscreenElement){
      video.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen().catch(()=>{});
    }
  }
  // 'm' / 'M' -> Toggle Mute
  else if(e.key === 'm' || e.key === 'M'){
    e.preventDefault();
    video.muted = !video.muted;
    showHud(video.muted ? '🔇 Muted' : '🔊 Unmuted');
  }
  // 'c' / 'C' -> Toggle Subtitles
  else if(e.key === 'c' || e.key === 'C'){
    e.preventDefault();
    toggleCC();
  }
  // Escape -> Close Player
  else if(e.key === 'Escape'){
    e.preventDefault();
    closePlayer();
  }
});

let t; document.getElementById('q').addEventListener('input',()=>{
  clearTimeout(t); t=setTimeout(()=>{page=1;load();},350);});
['sort','kind'].forEach(i=>document.getElementById(i).addEventListener('change',()=>{page=1;load();}));
load();
</script>
</body>
</html>
