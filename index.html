<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>CineMyMovies - Stream Movies &amp; Series</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
:root {
  --bg: #0e0f13;
  --card: #181a20;
  --card-hover: #222630;
  --accent: #ff7b39;
  --accent-glow: rgba(255,123,57,0.25);
  --txt: #ececed;
  --dim: #9aa0aa;
  --border: #262932;
}

html {
  box-sizing: border-box;
  -webkit-text-size-adjust: 100%;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
  overflow-y: auto;
  scroll-behavior: smooth;
}
*, *:before, *:after {
  box-sizing: inherit;
}
body {
  margin: 0;
  padding: 0;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
  min-height: 100vh;
  position: relative;
  background: var(--bg);
  color: var(--txt);
  font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* Header System */
header {
  position: sticky;
  top: 0;
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 18px;
  background: #0e0f13f0;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid #1c1f26;
  width: 100%;
  max-width: 100vw;
}
.header-top-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
h1 {
  font-size: 20px;
  margin: 0;
  color: var(--accent);
  cursor: pointer;
  user-select: none;
  transition: transform .15s;
  flex-shrink: 0;
  letter-spacing: -0.3px;
  font-weight: 800;
}
h1:hover {
  transform: scale(1.03);
}
.header-controls {
  display: flex;
  align-items: center;
  gap: 7px;
}
select {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--txt);
  padding: 8px 10px;
  border-radius: 8px;
  outline: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: border-color .15s, background .15s;
}
select:focus {
  border-color: var(--accent);
}
.btn-density {
  display: none; /* Auto-shown on mobile screens via media query */
  align-items: center;
  justify-content: center;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--dim);
  padding: 0 9px;
  height: 32px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 11.5px;
  font-weight: 600;
  transition: .15s;
  user-select: none;
  white-space: nowrap;
}
.btn-density:hover, .btn-density:active {
  color: #fff;
  border-color: var(--accent);
  background: var(--card-hover);
}
.btn-auth {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--txt);
  padding: 0 10px;
  height: 32px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  transition: .15s;
  white-space: nowrap;
}
.btn-auth:hover {
  background: var(--card-hover);
  border-color: #3f4452;
  color: #fff;
}

.search-wrap {
  position: relative;
  flex: 1;
  max-width: 440px;
  display: flex;
  align-items: center;
}
.search-ico {
  position: absolute;
  left: 11px;
  width: 15px;
  height: 15px;
  color: var(--dim);
  pointer-events: none;
}
#q {
  width: 100%;
  padding: 8px 30px 8px 34px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--txt);
  border-radius: 8px;
  outline: none;
  font-size: 13.5px;
  transition: border-color .15s, box-shadow .15s;
}
#q:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.q-clear {
  position: absolute;
  right: 8px;
  background: none;
  border: none;
  color: var(--dim);
  font-size: 18px;
  cursor: pointer;
  padding: 2px 6px;
  line-height: 1;
  display: none;
  border-radius: 4px;
}
.q-clear:hover {
  color: #fff;
  background: #ffffff15;
}

/* Horizontal Category Filter Bar - Strictly Pan X without blocking vertical scroll */
.filter-bar {
  display: flex;
  gap: 6px;
  padding: 10px 14px 6px;
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-x pan-y;
  overscroll-behavior-y: auto;
  align-items: center;
  width: 100%;
  max-width: 100vw;
}
.filter-bar::-webkit-scrollbar {
  display: none;
}
.pill {
  flex-shrink: 0;
  background: #14161d;
  border: 1.5px solid var(--border);
  color: #cbd5e1;
  padding: 6px 14px;
  border-radius: 9999px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: .15s;
  user-select: none;
}
.pill:hover {
  color: #fff;
  background: #20242e;
  border-color: #4b5563;
}
.pill.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  box-shadow: 0 3px 12px rgba(255,123,57,0.36);
}
.pill-all {
  border-color: #ea580c !important;
  color: #fb923c !important;
  font-weight: 700;
}
.pill-all:hover {
  background: rgba(234, 88, 12, 0.16) !important;
}
.pill-all.active {
  background: #ea580c !important;
  border-color: #ea580c !important;
  color: #fff !important;
  box-shadow: 0 3px 12px rgba(234, 88, 12, 0.45) !important;
}
.pill-dub {
  border-color: #059669 !important;
  color: #34d399 !important;
  font-weight: 700;
}
.pill-dub:hover {
  background: rgba(5, 150, 105, 0.16) !important;
}
.pill-dub.active {
  background: #059669 !important;
  border-color: #059669 !important;
  color: #fff !important;
  box-shadow: 0 3px 12px rgba(5, 150, 105, 0.45) !important;
}
.pill-punjabi {
  border-color: #d97706 !important;
  color: #fbbf24 !important;
  font-weight: 700;
}
.pill-punjabi:hover {
  background: rgba(217, 119, 6, 0.16) !important;
}
.pill-punjabi.active {
  background: #d97706 !important;
  border-color: #d97706 !important;
  color: #fff !important;
  box-shadow: 0 3px 12px rgba(217, 119, 6, 0.45) !important;
}
.pill-hollywood {
  border-color: #0284c7 !important;
  color: #38bdf8 !important;
  font-weight: 700;
}
.pill-hollywood:hover {
  background: rgba(2, 132, 199, 0.16) !important;
}
.pill-hollywood.active {
  background: #0284c7 !important;
  border-color: #0284c7 !important;
  color: #fff !important;
  box-shadow: 0 3px 12px rgba(2, 132, 199, 0.45) !important;
}
.pill-bollywood {
  border-color: #e11d48 !important;
  color: #fb7185 !important;
  font-weight: 700;
}
.pill-bollywood:hover {
  background: rgba(225, 29, 72, 0.16) !important;
}
.pill-bollywood.active {
  background: #e11d48 !important;
  border-color: #e11d48 !important;
  color: #fff !important;
  box-shadow: 0 3px 12px rgba(225, 29, 72, 0.45) !important;
}
.pill-series {
  border-color: #8b5cf6 !important;
  color: #c084fc !important;
  font-weight: 700;
}
.pill-series:hover {
  background: rgba(139, 92, 246, 0.16) !important;
}
.pill-series.active {
  background: #7c3aed !important;
  border-color: #8b5cf6 !important;
  color: #fff !important;
  box-shadow: 0 3px 12px rgba(124, 58, 237, 0.45) !important;
}
.pill-movies {
  border-color: #0d9488 !important;
  color: #2dd4bf !important;
  font-weight: 700;
}
.pill-movies:hover {
  background: rgba(13, 148, 136, 0.16) !important;
}
.pill-movies.active {
  background: #0d9488 !important;
  border-color: #0d9488 !important;
  color: #fff !important;
  box-shadow: 0 3px 12px rgba(13, 148, 136, 0.45) !important;
}
.pill-ask {
  border-color: #ea580c !important;
  color: #fb923c !important;
  font-weight: 700;
}
.pill-ask:hover {
  background: rgba(234, 88, 12, 0.16) !important;
}
.pill-ask.active {
  background: #ea580c !important;
  border-color: #ea580c !important;
  color: #fff !important;
  box-shadow: 0 3px 12px rgba(234, 88, 12, 0.45) !important;
}
.pill-ym {
  border-color: #3b82f6 !important;
  color: #60a5fa !important;
  font-weight: 700;
}
.pill-ym:hover {
  background: rgba(59, 130, 246, 0.16) !important;
}
.pill-ym.active {
  background: #1d4ed8 !important;
  border-color: #3b82f6 !important;
  color: #fff !important;
  box-shadow: 0 3px 12px rgba(29, 78, 216, 0.45) !important;
}
.pill-divider {
  width: 1px;
  height: 20px;
  background: rgba(255,255,255,0.18);
  margin: 0 3px;
  flex-shrink: 0;
}

/* Search Dropdown System */
.search-dropdown {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  background: #13151b;
  border: 1px solid #2a2d36;
  border-radius: 9px;
  box-shadow: 0 14px 40px rgba(0,0,0,0.88);
  max-height: 60vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: none;
  z-index: 50;
}
.search-dropdown.open {
  display: block;
}
.s-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  cursor: pointer;
  transition: background .15s;
  border-bottom: 1px solid #1a1d24;
  text-decoration: none;
}
.s-item:last-child {
  border-bottom: none;
}
.s-item:hover, .s-item.active {
  background: #1e222c;
}
.s-thumb {
  width: 36px;
  height: 50px;
  object-fit: cover;
  border-radius: 4px;
  background: #222;
  flex-shrink: 0;
}
.s-info {
  flex: 1;
  min-width: 0;
}
.s-title {
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.s-meta {
  font-size: 11px;
  color: var(--dim);
  margin-top: 2px;
  display: flex;
  gap: 6px;
  align-items: center;
}
.s-badge {
  background: rgba(255,123,57,0.18);
  color: var(--accent);
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 9.5px;
  font-weight: 600;
}
.s-footer {
  padding: 9px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  text-align: center;
  background: #161820;
  cursor: pointer;
  transition: background .15s;
  border-top: 1px solid #242730;
}
.s-footer:hover {
  background: #20242e;
  text-decoration: underline;
}
.s-empty {
  padding: 16px;
  text-align: center;
  color: var(--dim);
  font-size: 12.5px;
}

/* Movie Poster Grid System - Mobile Friendly Compact Cards */
#grid {
  display: grid;
  width: 100%;
  max-width: 100vw;
  box-sizing: border-box;
  transition: opacity .15s;
}
#grid.loading {
  opacity: 0.35;
  pointer-events: none;
}

.card {
  position: relative;
  background: var(--card);
  overflow: hidden;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s, outline .15s;
  display: flex;
  flex-direction: column;
  user-select: none;
  outline: none;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}
.card:focus, .card:focus-visible {
  outline: 2.5px solid var(--accent);
  outline-offset: 3px;
  transform: translateY(-4px) scale(1.02);
  box-shadow: 0 12px 32px rgba(255,123,57,0.45);
  z-index: 5;
}
.card img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  background: #191b22;
}
.card .m {
  color: var(--dim);
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: auto;
}
.card-badges {
  position: absolute;
  top: 7px;
  left: 7px;
  display: flex;
  align-items: center;
  gap: 4px;
  z-index: 2;
  pointer-events: none;
  flex-wrap: wrap;
  max-width: calc(100% - 14px);
}
.card-badges .badge {
  position: static;
  top: auto;
  left: auto;
  max-width: none;
}
.badge {
  position: absolute;
  background: rgba(0,0,0,0.82);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  color: var(--accent);
  font-weight: 700;
  max-width: calc(100% - 10px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
  z-index: 2;
}
.badge-ask {
  background: #ea580c !important;
  color: #fff !important;
  font-weight: 700 !important;
  box-shadow: 0 2px 8px rgba(234,88,12,0.4) !important;
}
.badge-ym {
  background: #1d4ed8 !important;
  color: #fff !important;
  font-weight: 700 !important;
  box-shadow: 0 2px 8px rgba(29,78,216,0.4) !important;
}
.badge-dub {
  background: #059669 !important;
  color: #fff !important;
  font-weight: 700 !important;
  box-shadow: 0 2px 8px rgba(5,150,105,0.45) !important;
  border: 1px solid rgba(255,255,255,0.2) !important;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  letter-spacing: 0.2px;
}
.badge-dub .dub-txt-short { display: none; }
.badge-dub .dub-txt-full { display: inline; }
.badge-series {
  position: absolute;
  background: rgba(0,150,255,0.88);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  color: #fff;
  font-weight: 700;
  pointer-events: none;
  z-index: 2;
}

/* Breakpoint 1: Standard Desktop & Large Screens (> 860px) */
@media (min-width: 861px) {
  #grid {
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 14px;
    padding: 16px 18px 36px;
  }
  .card {
    border-radius: 9px;
  }
  .card .t {
    padding: 8px 9px 3px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card .m {
    padding: 0 9px 9px;
    font-size: 11px;
  }
  .badge {
    top: 7px;
    left: 7px;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .badge-series {
    top: 7px;
    right: 7px;
    font-size: 9.5px;
    padding: 2px 6px;
    border-radius: 4px;
  }
}

/* Breakpoint 2: Tablets & Medium Screens (601px - 860px) */
@media (min-width: 601px) and (max-width: 860px) {
  #grid {
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
    padding: 12px 14px 30px;
  }
  .card {
    border-radius: 8px;
  }
  .card .t {
    padding: 6px 7px 2px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card .m {
    padding: 0 7px 7px;
    font-size: 10px;
  }
  .card-badges {
    top: 6px;
    left: 6px;
    gap: 3px;
  }
  .card-badges .badge {
    font-size: 8.5px;
    padding: 2px 5px;
    border-radius: 4px;
  }
  .badge {
    top: 6px;
    left: 6px;
    font-size: 8.5px;
    padding: 2px 5px;
    border-radius: 4px;
  }
  .badge-series {
    top: 6px;
    right: 6px;
    font-size: 8px;
    padding: 1.5px 5px;
    border-radius: 4px;
  }
}

/* Breakpoint 3: Mobile Screens (<= 600px) - Render Small 3 Cards Default, No Horizontal Scroll */
@media (max-width: 600px) {
  header {
    flex-direction: column;
    align-items: stretch;
    padding: 8px 10px;
    gap: 7px;
  }
  .header-top-row {
    width: 100%;
    justify-content: space-between;
    gap: 6px;
  }
  h1 {
    font-size: 17px;
  }
  .header-controls {
    gap: 5px;
  }
  select {
    padding: 5px 6px;
    font-size: 11.5px;
    border-radius: 6px;
    max-width: 95px;
    height: 31px;
  }
  .btn-density {
    display: inline-flex;
    height: 31px;
    padding: 0 7px;
    font-size: 11px;
  }
  .search-wrap {
    width: 100%;
    max-width: 100%;
  }
  #q {
    padding: 7px 28px 7px 30px;
    font-size: 13px;
    border-radius: 6px;
    height: 34px;
  }
  .search-ico {
    left: 9px;
    width: 14px;
    height: 14px;
  }

  .filter-bar {
    padding: 8px 10px 4px;
    gap: 5px;
  }
  .pill {
    padding: 5px 11px;
    font-size: 11.5px;
    border-radius: 14px;
  }

  /* Default 3-column compact layout on mobile: fits cleanly within viewport */
  #grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    padding: 8px 8px 24px;
  }
  .card {
    border-radius: 7px;
  }
  .card .t {
    padding: 5px 5px 2px;
    font-size: 10.5px;
    font-weight: 600;
    line-height: 1.22;
    height: 2.45em;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .card .m {
    padding: 0 5px 5px;
    font-size: 9px;
  }
  .card-badges {
    top: 5px;
    left: 5px;
    gap: 3px;
  }
  .card-badges .badge {
    font-size: 8px;
    padding: 1.5px 4.5px;
    border-radius: 3px;
  }
  .badge-dub .dub-txt-short { display: inline; }
  .badge-dub .dub-txt-full { display: none; }
  .badge {
    top: 5px;
    left: 5px;
    font-size: 8px;
    padding: 1.5px 4.5px;
    border-radius: 3px;
  }
  .badge-series {
    top: 5px;
    right: 5px;
    font-size: 7.5px;
    padding: 1px 4px;
    border-radius: 3px;
  }

  /* Optional 2-column mode when toggled by user on mobile */
  #grid.cols-2 {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 10px;
    padding: 10px 10px 24px;
  }
  #grid.cols-2 .card {
    border-radius: 8px;
  }
  #grid.cols-2 .card .t {
    font-size: 12px;
    padding: 6px 7px 3px;
    height: 2.5em;
  }
  #grid.cols-2 .card .m {
    font-size: 10.5px;
    padding: 0 7px 7px;
  }
  #grid.cols-2 .card-badges .badge,
  #grid.cols-2 .badge {
    font-size: 9px;
    padding: 2px 6px;
  }
  #grid.cols-2 .badge-dub .dub-txt-short { display: none; }
  #grid.cols-2 .badge-dub .dub-txt-full { display: inline; }
}

/* Breakpoint 4: Ultra-narrow screens (<= 330px) */
@media (max-width: 330px) {
  #grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    padding: 6px 6px 20px;
  }
  .card-badges {
    top: 4px;
    left: 4px;
    gap: 2px;
  }
  .card-badges .badge {
    font-size: 7.5px;
    padding: 1px 3.5px;
  }
}

/* Enhanced Pagination System */
#pager {
  display: flex;
  gap: 8px;
  justify-content: center;
  align-items: center;
  padding: 18px 14px 44px;
  flex-wrap: wrap;
  width: 100%;
  box-sizing: border-box;
}
#pager button {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--txt);
  padding: 10px 18px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  transition: .15s;
  min-width: 44px;
  user-select: none;
}
#pager button:hover:not(:disabled) {
  background: var(--card-hover);
  border-color: var(--accent);
  color: #fff;
}
#pager button.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 700;
  box-shadow: 0 2px 8px rgba(255,123,57,0.3);
}
#pager button:disabled {
  opacity: 0.35;
  cursor: default;

<body>
<header>

<!-- Quick Category / Genre / Source Pill Filter Bar (Horizontally scrollable with touch) -->

  <div class="box">
    <div class="row">
      <h2 id="p-title"></h2>

        <button id="btn-rewind" class="btn-action" onclick="handleSkip(-1)" title="Rewind 10s (Left Arrow / Click)">⏪ -10s</button>
        <button id="btn-forward" class="btn-action" onclick="handleSkip(1)" title="Skip Forward 10s (Right Arrow / Click)">⏩ +10s</button>
        <button id="btn-cc" class="btn-action" onclick="toggleCC()" title="Toggle English Subtitles (Press C)">CC: English (ON)</button>
        <button id="btn-fullscreen" class="btn-action btn-fullscreen" onclick="togglePlayerFullscreen()" title="Fullscreen (Press F)">⛶ Fullscreen</button>

      </div>

      <video id="v" controls playsinline crossorigin="anonymous"></video>
      <iframe id="p-iframe" style="display:none;width:100%;height:100%;border:0;position:absolute;inset:0;" allow="accelerometer *; autoplay *; clipboard-write *; encrypted-media *; gyroscope *; picture-in-picture *; web-share *; fullscreen *" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" referrerpolicy="no-referrer"></iframe>
      <div id="player-hud"></div>
    </div>

    <div class="status-wrap">
      <div class="status" id="p-status"></div>
      <div id="retry-wrap" style="display:none">
        <button class="btn-retry" onclick="retryStream()">🔄 Retry Stream</button>

<script>
const grid = document.getElementById('grid'), pager = document.getElementById('pager');
const overlay = document.getElementById('overlay'), video = document.getElementById('v');
const statusEl = document.getElementById('p-status'), hudEl = document.getElementById('player-hud');
const retryWrap = document.getElementById('retry-wrap');
const playerContainer = document.getElementById('player-container');
const pIframe = document.getElementById('p-iframe');

let page = 1, totalPages = 1, hls = null, curId = null, refreshing = false, keepTime = 0;
let skipAccumulator = 0, skipResetTimer = null, hudTimer = null, stallCheckTimer = null;
let currentStreamAbort = null, currentResolveSeq = 0;
let activeGenre = '';
let lastTotal = 0, lastPerPage = 48;

/* Configurable Backend API Endpoint (Supports static CDN hosts like Netlify/Vercel) */
const API_BASE = (window.API_BASE || localStorage.getItem('cm_api_base') || '').replace(/\/+$/, '');

function saveApiBase(){
  const inp = document.getElementById('api-base-input');
  if(!inp) return;
  const val = inp.value.trim().replace(/\/+$/, '');
  if(!val){
    localStorage.removeItem('cm_api_base');
  } else {
    localStorage.setItem('cm_api_base', val);
  }
  window.location.reload();
}
window.saveApiBase = saveApiBase;

/* Mobile Column Density Mode (3 compact cards default, 2 cards option) */
let mobileCols = localStorage.getItem('cm_mobile_cols') || '3';

function applyDensity(cols){
  mobileCols = cols;
  localStorage.setItem('cm_mobile_cols', cols);
  const iconEl = document.getElementById('density-icon');
  if(cols === '2'){
    grid.classList.add('cols-2');
    if(iconEl) iconEl.textContent = '📱 2';
  } else {
    grid.classList.remove('cols-2');
    if(iconEl) iconEl.textContent = '📱 3';
  }
}

function toggleDensity(){
  applyDensity(mobileCols === '3' ? '2' : '3');
}

applyDensity(mobileCols);

const esc = s => String(s == null ? '' : s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

/* Authentication & Session Management */
const _origFetch = window.fetch;
window.fetch = async function(...args) {
  const resp = await _origFetch.apply(this, args);
  if (resp && resp.status === 401) {
    const currentPath = window.location.pathname + window.location.search;
    window.location.replace('/login?next=' + encodeURIComponent(currentPath));
  }
  return resp;
};

function performLogout() {
  const form = document.createElement('form');
  form.method = 'POST';
  form.action = '/logout';
  const match = document.cookie.match(new RegExp('(^| )cms_csrf=([^;]+)'));
  if (match) {
    const inp = document.createElement('input');
    inp.type = 'hidden';
    inp.name = 'csrf_token';
    inp.value = decodeURIComponent(match[2]);
    form.appendChild(inp);
  }
  document.body.appendChild(form);
  form.submit();
}

async function checkAuthSession() {
  try {
    const r = await _origFetch('/api/auth/check');
    if (r.ok) {
      const data = await r.json();
      if (!data.authenticated) {
        window.location.replace('/login?notice=Session+revoked.+Please+log+in+again.');
        return;
      }
      if (data.role === 'admin') {
        const adminBtn = document.getElementById('btn-admin-link');
        if (adminBtn) adminBtn.style.display = 'inline-flex';
      }
    } else if (r.status === 401) {
      window.location.replace('/login?notice=Session+expired.+Please+log+in+again.');
    }
  } catch(e) {}
}

checkAuthSession();
setInterval(checkAuthSession, 60000);

/* Clicking CineMyMovies title goes to Home page 1, Newly Added */
function goHome(){
  closePlayer();
  closeDropdown();
  page = 1;
  activeGenre = '';
  activeSource = '';
  const sf = document.getElementById('source-filter');
  if(sf) sf.value = '';
  document.getElementById('q').value = '';
  const clr = document.getElementById('q-clear');
  if(clr) clr.style.display = 'none';
  document.getElementById('sort').value = 'recent';
  document.getElementById('kind').value = '';
  syncFilterPills('', '', '');
  window.scrollTo({top: 0, behavior: 'smooth'});
  load();
}

let activeSource = '';

/* Quick Filter Pills (All, Ask4Movie, YoMovies, Movies, Series, Bollywood, Hollywood...) */
function setQuickFilter(kindVal, genreVal, sourceVal = ''){
  closePlayer();
  document.getElementById('kind').value = kindVal;
  activeGenre = genreVal;
  activeSource = sourceVal;
  const srcSelect = document.getElementById('source-filter');
  if(srcSelect) srcSelect.value = sourceVal;
  page = 1;
  syncFilterPills(kindVal, genreVal, sourceVal);
  window.scrollTo({top: 0, behavior: 'instant'});
  load();
}

function syncFilterPills(kindVal, genreVal, sourceVal = ''){
  document.querySelectorAll('.filter-bar .pill').forEach(btn => {
    const k = btn.getAttribute('data-kind') || '';
    const g = btn.getAttribute('data-genre') || '';
    const s = btn.getAttribute('data-source') || '';
    if (k === (kindVal || '') && g === (genreVal || '') && s === (sourceVal || '')) {
      btn.classList.add('active');
      // Release button focus on click so TV browsers do not anchor/lock viewport scrolling to top
      if(document.activeElement === btn && !window._isDpadNavigating){
        btn.blur();
      }
    } else {
      btn.classList.remove('active');
    }
  });
}

/* Enhanced Pagination Navigation */
function gotoPage(p){
  const target = parseInt(p, 10);
  if(!target || isNaN(target) || target < 1) return;
  page = target;
  window.scrollTo({top: 0, behavior: 'smooth'});
  load();
}
window.gotoPage = gotoPage;
window.go = gotoPage;

function renderPager(total, perPage, curPage){
  totalPages = Math.max(1, Math.ceil(total / perPage));
  curPage = Math.max(1, Math.min(totalPages, curPage));
  let html = '';

  const isMobile = window.innerWidth <= 600;

  // Prev button
  html += `<button ${curPage <= 1 ? 'disabled' : ''} onclick="gotoPage(${curPage - 1})" aria-label="Previous page">‹ Prev</button>`;

  if (isMobile) {
    // Ultra-clean mobile indicator that never overflows
    html += `<span class="pager-mobile-indicator">Page ${curPage} of ${totalPages}</span>`;
  } else {
    // Desktop multi-page buttons
    if (totalPages <= 7) {
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="${i === curPage ? 'active' : ''}" onclick="gotoPage(${i})">${i}</button>`;
      }
    } else {
      html += `<button class="${curPage === 1 ? 'active' : ''}" onclick="gotoPage(1)">1</button>`;
      if (curPage > 3) html += `<span class="pager-ellipsis">…</span>`;

      const start = Math.max(2, curPage - 1);
      const end = Math.min(totalPages - 1, curPage + 1);
      for (let i = start; i <= end; i++) {
        html += `<button class="${i === curPage ? 'active' : ''}" onclick="gotoPage(${i})">${i}</button>`;
      }

      if (curPage < totalPages - 2) html += `<span class="pager-ellipsis">…</span>`;
      html += `<button class="${curPage === totalPages ? 'active' : ''}" onclick="gotoPage(${totalPages})">${totalPages}</button>`;
    }
  }

  // Next button
  html += `<button ${curPage >= totalPages ? 'disabled' : ''} onclick="gotoPage(${curPage + 1})" aria-label="Next page">Next ›</button>`;

  // Informative counter
  html += `<span class="pager-info">${total.toLocaleString()} titles</span>`;

  pager.innerHTML = html;
}

window.addEventListener('resize', ()=>{
  if(lastTotal > 0) renderPager(lastTotal, lastPerPage, page);
});

async function load(){
  grid.classList.add('loading');
  const p = new URLSearchParams({
    page,
    per_page: 48,
    sort: document.getElementById('sort').value
  });
  const src = document.getElementById('source-filter')?.value || activeSource || '';
  if(src) p.set('source', src);
  const q = document.getElementById('q').value.trim(); if(q) p.set('q',q);
  const k = document.getElementById('kind').value; if(k!=='') p.set('series',k);
  if(activeGenre) p.set('genre', activeGenre);

  try {
    const res = await fetch(API_BASE + '/api/movies?' + p);
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }
    const d = await res.json();
    lastTotal = d.total || 0;
    lastPerPage = d.per_page || 48;
    if(!window.movieCache) window.movieCache = new Map();
    (d.items || []).forEach(it => window.movieCache.set(it.id, it));

    grid.innerHTML = (d.items || []).map(m=>`
      <div class="card" tabindex="0" role="button" aria-label="${esc(m.title)}" data-id="${m.id}" onclick="openPlayer(${m.id})">
        <div class="card-badges">
          ${m.source==='ask4movie'
            ? '<span class="badge badge-ask">🍿 ask</span>'

/* HUD Feedback */
function showHud(text){
  if(!hudEl) return;
  hudEl.textContent = text;
  hudEl.classList.add('show');
  clearTimeout(hudTimer);
  hudTimer = setTimeout(()=>{ hudEl.classList.remove('show'); }, 850);
}

/* 10s Skip Handler with Instant Recovery (Never pauses or gets stuck) */
function handleSkip(direction){
  if(!video) return;
  const wasPlaying = !video.paused;

  if(direction > 0){
    if(skipAccumulator < 0) skipAccumulator = 0;
    skipAccumulator += 10;
  } else {
    if(skipAccumulator > 0) skipAccumulator = 0;
    skipAccumulator -= 10;
  }

  const duration = (video.duration && !isNaN(video.duration)) ? video.duration : 999999;
  const targetTime = Math.max(0, Math.min(duration - 1, video.currentTime + (direction * 10)));
  video.currentTime = targetTime;

  const text = skipAccumulator > 0 ? `⏩ +${skipAccumulator}s` : `⏪ ${skipAccumulator}s`;
  showHud(text);

  // Resume playback immediately if it was active
  if(wasPlaying){
    const p = video.play();
    if(p && typeof p.catch === 'function') p.catch(()=>{});
  }

  clearTimeout(skipResetTimer);
  skipResetTimer = setTimeout(()=>{ skipAccumulator = 0; }, 750);
}

// Double click left or right half of player to skip 10s
if(playerContainer){
  playerContainer.addEventListener('dblclick', (e)=>{
    if(e.target.tagName === 'BUTTON') return;
    const rect = playerContainer.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if(x < rect.width * 0.45){
      handleSkip(-1);
    } else if(x > rect.width * 0.55){
      handleSkip(1);
    }
  });
}

async function fetchStream(id, fresh = false){
  const mySeq = ++currentResolveSeq;
  if(currentStreamAbort) currentStreamAbort.abort();
  currentStreamAbort = new AbortController();

  if(retryWrap) retryWrap.style.display = 'none';
  statusEl.innerHTML = `<span class="spinner"></span> Resolving stream from high-speed servers…`;

  // Timeout guard (16s)
  const timeoutId = setTimeout(()=>{
    if(mySeq === currentResolveSeq){
      if(currentStreamAbort) currentStreamAbort.abort();
      statusEl.innerHTML = `<span style="color:#ff9359">⚠️ Stream resolution is taking longer than usual.</span>`;
      if(retryWrap) retryWrap.style.display = 'block';
    }
  }, 16000);

  try {
    const res = await fetch(API_BASE + `/api/stream/${id}${fresh?'?fresh=1':''}`, {
      signal: currentStreamAbort.signal
    });
    clearTimeout(timeoutId);

    if(mySeq !== currentResolveSeq) return;

    if(!res.ok){
      const errData = await res.json().catch(()=>({}));
      throw new Error(errData.detail || `Server returned ${res.status}`);
    }

    const s = await res.json();
    if(mySeq !== currentResolveSeq) return;
    if(!s.play && !s.url) throw new Error('No playable stream found.');

    const playUrl = s.url || s.play;
    const kind = s.kind || (s.type === 'embed' ? 'iframe' : 'hls');

    const srvBox = document.getElementById('server-switcher');
    if(srvBox) srvBox.innerHTML = '';

    if(kind === 'iframe' || s.type === 'embed'){
      // External embed player (Ask4Movie iframe / Vidsrc)
      if(hls){ hls.destroy(); hls = null; }
      video.pause();
      video.style.display = 'none';
      if(pIframe){
        pIframe.style.display = 'block';
        setIframeSrc(playUrl);
      }
      const rw = document.getElementById('btn-rewind'), fw = document.getElementById('btn-forward'), cc = document.getElementById('btn-cc');
      if(rw) rw.style.display = 'none';
      if(fw) fw.style.display = 'none';
      if(cc) cc.style.display = 'none';

      const firstServerLabel = (s.servers && s.servers.length > 0) ? s.servers[0].label : (s.host || 'HD');
      statusEl.textContent = `${firstServerLabel} · Active stream player ${s.cached ? '(cached)' : ''}`;

      // Server switcher pills
      if(srvBox && s.servers && s.servers.length > 1){
        s.servers.forEach((srv, idx) => {
          const btn = document.createElement('button');
          const isSelected = srv.url === playUrl || (!playUrl && idx === 0);
          btn.className = 'pill' + (isSelected ? ' active' : '');
          btn.textContent = srv.label || `Server ${idx + 1}`;
          btn.style.cssText = 'padding:4px 12px;font-size:12px;cursor:pointer;';
          btn.onclick = () => {
            setIframeSrc(srv.url);
            srvBox.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            statusEl.textContent = `${srv.label || ('Server ' + (idx + 1))} · Active stream player`;
          };
          srvBox.appendChild(btn);
        });
        srvBox.style.display = 'flex';
      } else if(srvBox) {
        srvBox.style.display = 'none';
      }
    } else {
      // Native HLS player (YoMovies / Speedostream)
      if(pIframe){
        pIframe.style.display = 'none';
        setIframeSrc('about:blank');
      }
      if(srvBox) srvBox.style.display = 'none';
      video.style.display = 'block';
      const rw = document.getElementById('btn-rewind'), fw = document.getElementById('btn-forward'), cc = document.getElementById('btn-cc');
      if(rw) rw.style.display = 'inline-flex';
      if(fw) fw.style.display = 'inline-flex';
      if(cc) cc.style.display = 'inline-flex';
      statusEl.textContent = `Server ${s.code || s.host || '1'} · Active token (${Math.round((s.expires_in||1800)/60)} min) ${s.cached ? '(cached)' : ''}`;
      attach(playUrl);
    }
  } catch(err) {
    clearTimeout(timeoutId);
    if(err.name === 'AbortError') return;
    if(mySeq !== currentResolveSeq) return;

    statusEl.innerHTML = `<span style="color:#ff8888">⚠️ ${esc(err.message || 'No playable stream for this title.')}</span>`;
    if(retryWrap) retryWrap.style.display = 'block';
  }
}

function retryStream(){
  if(curId) fetchStream(curId, true);
}

/* Silently renew token on fatal error */
async function selfHeal(){
  if(refreshing || !curId) return;
  refreshing = true;
  keepTime = video.currentTime;
  statusEl.innerHTML = `<span class="spinner"></span> Token refreshed — resuming playback…`;
  await fetchStream(curId, true);
  setTimeout(()=>{ refreshing = false; }, 1500);
}

function attach(url){
  if(url && url.startsWith('/') && API_BASE) url = API_BASE + url;
  if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src = url;
    video.play().catch(()=>{});
    video.onerror = ()=>selfHeal();
    return;
  }

  if(hls){ hls.destroy(); hls = null; }

  hls = new Hls({
    maxBufferLength: 30,
    maxMaxBufferLength: 60,
    backBufferLength: 30,
    enableWorker: true,
    lowLatencyMode: false,
    nudgeMaxRetry: 5,
    nudgeOffset: 0.2
  });

  hls.loadSource(url);
  hls.attachMedia(video);

  hls.on(Hls.Events.MANIFEST_PARSED, ()=>{
    if(keepTime > 1){
      video.currentTime = keepTime;
      keepTime = 0;
    }
    video.play().catch(()=>{});
  });

  hls.on(Hls.Events.ERROR, (_, data)=>{
    if(!data.fatal) return;
    if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
      console.warn('HLS Network error during seek/buffer, recovering...', data);
      hls.startLoad();
    } else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
      console.warn('HLS Media error, recovering...', data);
      hls.recoverMediaError();
    } else {
      console.warn('HLS fatal error, self-healing...', data);
      selfHeal();
    }
  });
}

// Register Samsung Tizen TV remote Back & Exit keys
try {
  if (window.tizen && window.tizen.tvinputdevice) {

function isBackOrExitKey(e){
  const k = e.key;
  const c = e.keyCode || e.which;
  if(k === 'Escape' || k === 'Back' || k === 'BrowserBack' || k === 'GoBack' || k === 'Exit' || k === 'Return' || k === 'Cancel' || k === 'Uprev'){
    return true;
  }
  // 27: Escape, 4: Android Back, 461: LG webOS Back, 10009: Samsung Tizen Return, 10182: Samsung Tizen Exit, 166: Browser Back
  if(c === 27 || c === 4 || c === 461 || c === 10009 || c === 10182 || c === 166){
    return true;
  }
  // Backspace key on TV remotes when not actively typing in an input
  const tag = document.activeElement ? document.activeElement.tagName : '';
  if((k === 'Backspace' || c === 8) && tag !== 'INPUT' && tag !== 'TEXTAREA'){
    return true;
  }
  return false;
}

  }
}

/* Pre-empt expiry every 25 min (TTL is 30) */

/* Keyboard and Remote Controls */
window.addEventListener('keydown', (e)=>{
  // Check Back / Exit key first across all TV remotes (Android, Samsung Tizen, LG webOS, Fire TV)
  if(isBackOrExitKey(e)){
    if(overlay && overlay.classList.contains('on')){
      e.preventDefault();
      e.stopPropagation();
      closePlayer();
      return;
    }
    if(searchDropdown && searchDropdown.classList.contains('open')){
      e.preventDefault();
      e.stopPropagation();
      closeDropdown();
      return;
    }
  }

  if(document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT')){
    if(e.key === 'Escape') document.activeElement.blur();
    return;
  }
  const isPlayerOpen = overlay.classList.contains('on');
  if(!isPlayerOpen) return;

  // Arrow Right or Remote FastForward / TrackNext -> Skip Forward 10s
  if(e.key === 'ArrowRight' || e.code === 'ArrowRight' || e.key === 'MediaFastForward' || e.key === 'MediaTrackNext' || e.keyCode === 39){
    e.preventDefault();
    handleSkip(1);
  }
  // Arrow Left or Remote Rewind / TrackPrevious -> Skip Backward 10s
  else if(e.key === 'ArrowLeft' || e.code === 'ArrowLeft' || e.key === 'MediaRewind' || e.key === 'MediaTrackPrevious' || e.keyCode === 37){
    e.preventDefault();
    handleSkip(-1);
  }
  // Arrow Up -> Volume Up (+10%)
  else if(e.key === 'ArrowUp' || e.keyCode === 38){
    e.preventDefault();
    video.volume = Math.min(1, Math.round((video.volume + 0.1) * 10) / 10);
    showHud(`🔊 Volume ${Math.round(video.volume * 100)}%`);
  }
  // Arrow Down -> Volume Down (-10%)
  else if(e.key === 'ArrowDown' || e.keyCode === 40){
    e.preventDefault();
    video.volume = Math.max(0, Math.round((video.volume - 0.1) * 10) / 10);
    showHud(`🔉 Volume ${Math.round(video.volume * 100)}%`);
  }
  // Space / 'k' / MediaPlayPause -> Toggle Play / Pause
  else if(e.key === ' ' || e.code === 'Space' || e.key === 'k' || e.key === 'K' || e.key === 'MediaPlayPause' || e.keyCode === 32){
    e.preventDefault();
    if(video.paused){
      video.play().catch(()=>{});
      showHud('▶ Play');
    } else {
      video.pause();
      showHud('⏸ Pause');
    }
  }
  // 'f' / 'F' -> Toggle Fullscreen
  else if(e.key === 'f' || e.key === 'F'){
    e.preventDefault();
    togglePlayerFullscreen();
  }
  // 'm' / 'M' -> Toggle Mute
  else if(e.key === 'm' || e.key === 'M'){
    e.preventDefault();
    video.muted = !video.muted;
    showHud(video.muted ? '🔇 Muted' : '🔊 Unmuted');
  }
  // 'c' / 'C' -> Toggle Subtitles
  else if(e.key === 'c' || e.key === 'C'){
    e.preventDefault();
    toggleCC();
  }
}, true);

/* TV Remote D-Pad Navigation & Smooth Scroll System */
window._isDpadNavigating = false;

// Filter bar mouse wheel vertical passthrough (never blocks page scroll)
const filterBarEl = document.getElementById('filter-bar');
if(filterBarEl){
  filterBarEl.addEventListener('wheel', (e)=>{
    if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){
      window.scrollBy({ top: e.deltaY, behavior: 'auto' });
    }
  }, { passive: true });
}

// Open card on Enter / Space when focused via TV remote or keyboard
grid.addEventListener('keydown', (e)=>{
  const card = e.target.closest('.card');
  if(!card) return;
  if(e.key === 'Enter' || e.key === ' ' || e.keyCode === 13 || e.keyCode === 32){
    e.preventDefault();
    const id = card.getAttribute('data-id');
    if(id) openPlayer(id);
  }
});

// Arrow key navigation between pills, cards, and pagination
window.addEventListener('keydown', (e)=>{
  // If player modal is open, let player controls handle it
  if(overlay && overlay.classList.contains('on')) return;

  // If typing in search or selects, do not intercept
  if(document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT')) return;

  const key = e.key;
  const isDown = key === 'ArrowDown' || e.keyCode === 40;
  const isUp = key === 'ArrowUp' || e.keyCode === 38;
  const isLeft = key === 'ArrowLeft' || e.keyCode === 37;
  const isRight = key === 'ArrowRight' || e.keyCode === 39;

  if(!isDown && !isUp && !isLeft && !isRight) return;

  window._isDpadNavigating = true;
  const cards = Array.from(grid.querySelectorAll('.card'));
  const activeEl = document.activeElement;
  const isCard = activeEl && activeEl.classList.contains('card');
  const isPill = activeEl && activeEl.classList.contains('pill');
  const isPager = activeEl && activeEl.closest('#pager');

  // Case 1: Focus is currently on a Filter Pill
  if(isPill){
    if(isDown){
      e.preventDefault();
      if(cards.length > 0){
        cards[0].focus();
        cards[0].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      } else {
        window.scrollBy({ top: 260, behavior: 'smooth' });
      }
    } else if(isRight || isLeft){
      const pills = Array.from(document.querySelectorAll('.filter-bar .pill'));
      const idx = pills.indexOf(activeEl);
      if(idx !== -1){
        const nextIdx = isRight ? Math.min(pills.length - 1, idx + 1) : Math.max(0, idx - 1);
        if(nextIdx !== idx){
          e.preventDefault();
          pills[nextIdx].focus();
          pills[nextIdx].scrollIntoView({ inline: 'nearest', behavior: 'smooth' });
        }
      }
    }
    return;
  }

  // Case 2: Focus is currently on a Movie Card
  if(isCard && cards.length > 0){
    const idx = cards.indexOf(activeEl);
    if(idx === -1) return;

    // Detect grid columns dynamically
    let cols = 1;
    const currentTop = activeEl.offsetTop;
    for(let i = idx + 1; i < cards.length; i++){
      if(cards[i].offsetTop > currentTop){
        cols = i - idx;
        break;
      }
    }
    if(cols === 1 && idx > 0){
      const r0 = cards[0].offsetTop;
      for(let i = 1; i < cards.length; i++){
        if(cards[i].offsetTop > r0){
          cols = i;
          break;
        }
      }
    }
    if(cols < 1) cols = 4;

    if(isDown){
      e.preventDefault();
      const nextIdx = idx + cols;
      if(nextIdx < cards.length){
        cards[nextIdx].focus();
        cards[nextIdx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      } else {
        // Move focus down to pagination
        const pagerBtn = pager ? pager.querySelector('button:not([disabled])') : null;
        if(pagerBtn){
          pagerBtn.focus();
          pagerBtn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        } else {
          window.scrollBy({ top: 300, behavior: 'smooth' });
        }
      }
    } else if(isUp){
      e.preventDefault();
      const prevIdx = idx - cols;
      if(prevIdx >= 0){
        cards[prevIdx].focus();
        cards[prevIdx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      } else {
        // Scroll to top and focus the active filter pill
        const activePill = document.querySelector('.filter-bar .pill.active') || document.querySelector('.filter-bar .pill');
        if(activePill){
          activePill.focus();
          activePill.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    } else if(isRight){
      e.preventDefault();
      if(idx + 1 < cards.length){
        cards[idx + 1].focus();
        cards[idx + 1].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    } else if(isLeft){
      e.preventDefault();
      if(idx - 1 >= 0){
        cards[idx - 1].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }
    return;
  }

  // Case 3: Focus is on Pager
  if(isPager && isUp){
    e.preventDefault();
    if(cards.length > 0){
      const lastCard = cards[cards.length - 1];
      lastCard.focus();
      lastCard.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
    return;
  }

  // Case 4: No card/pill focused (body or container focused)
  // Ensure TV remote arrow down / up smoothly scrolls the page
  if(!activeEl || activeEl === document.body || activeEl === document.documentElement){
    if(isDown){
      window.scrollBy({ top: 260, behavior: 'smooth' });
    } else if(isUp){
      window.scrollBy({ top: -260, behavior: 'smooth' });
    }
  }
});

/* Search Bar Dropdown System across Movies */
const qInput = document.getElementById('q');
const qClear = document.getElementById('q-clear');
const searchDropdown = document.getElementById('search-dropdown');
let searchDebounceTimer = null;
let activeDropdownIdx = -1;

function clearSearch(){
  qInput.value = '';
  qClear.style.display = 'none';
  closeDropdown();
  page = 1;
  load();
  qInput.focus();
}

function closeDropdown(){
  searchDropdown.classList.remove('open');
  searchDropdown.innerHTML = '';
  activeDropdownIdx = -1;
}

async function renderSearchDropdown(query){
  if(!query || !query.trim()){
    closeDropdown();
    qClear.style.display = 'none';
    return;
  }
  qClear.style.display = 'block';

  try {
    const res = await fetch(API_BASE + `/api/search?q=${encodeURIComponent(query.trim())}&limit=8`);
    const data = await res.json();
    if(!searchDropdown) return;
    if(data.items && data.items.length > 0){
      if(!window.movieCache) window.movieCache = new Map();
      data.items.forEach(it => window.movieCache.set(it.id, it));
    }

    if(!data.items || data.items.length === 0){
      searchDropdown.innerHTML = `<div class="s-empty">No titles found matching "${esc(query)}".</div>`;
      searchDropdown.classList.add('open');
      return;
    }

    let html = data.items.map((m, idx)=>`
      <div class="s-item" data-idx="${idx}" onclick="selectSearchMovie(${m.id})">
        <img class="s-thumb" src="${esc(m.poster)}" loading="lazy" alt="" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2238%22 height=%2254%22 fill=%22%23222%22><rect width=%22100%%22 height=%22100%%22/></svg>'">
        <div class="s-info">
          <div class="s-title">${esc(m.title)}</div>
          <div class="s-meta">
            ${m.year?`<span>${esc(m.year)}</span>`:''}
            ${m.quality?`<span class="s-badge">${esc(m.quality)}</span>`:''}
            ${m.imdb?`<span>★ ${esc(m.imdb)}</span>`:''}
            <span>${m.is_series?'Series':'Movie'}</span>
          </div>
        </div>
      </div>
    `).join('');

    html += `<div class="s-footer" onclick="viewAllSearchResults('${esc(query)}')">
      🔍 View all ${data.total.toLocaleString()} matching titles in grid →
    </div>`;

    searchDropdown.innerHTML = html;
    searchDropdown.classList.add('open');
    activeDropdownIdx = -1;
  } catch(e) {
    console.error(e);
  }
}

function selectSearchMovie(id){
  closeDropdown();
  openPlayer(id);
}

function viewAllSearchResults(query){
  closeDropdown();
  qInput.value = query;
  page = 1;
  load();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// Live input listener: instant dropdown + grid update
qInput.addEventListener('input', ()=>{
  const val = qInput.value.trim();
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(()=>{
    renderSearchDropdown(val);
    page = 1;
    load();
  }, 130);
});

// Re-open dropdown on focus if input has value
qInput.addEventListener('focus', ()=>{
  if(qInput.value.trim()) renderSearchDropdown(qInput.value.trim());
});

// Click outside closes dropdown
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.search-wrap')){
    closeDropdown();
  }
});

// Keyboard navigation in search bar (ArrowDown, ArrowUp, Enter, Escape)
qInput.addEventListener('keydown', (e)=>{
  const items = searchDropdown.querySelectorAll('.s-item');
  if(!searchDropdown.classList.contains('open') || items.length === 0){
    if(e.key === 'Enter'){
      closeDropdown();
      page = 1;
      load();
    }
    return;
  }

  if(e.key === 'ArrowDown'){
    e.preventDefault();
    activeDropdownIdx = (activeDropdownIdx + 1) % items.length;
    highlightItem(items);
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    activeDropdownIdx = (activeDropdownIdx - 1 + items.length) % items.length;
    highlightItem(items);
  } else if(e.key === 'Enter'){
    e.preventDefault();
    if(activeDropdownIdx >= 0 && items[activeDropdownIdx]){
      items[activeDropdownIdx].click();
    } else {
      viewAllSearchResults(qInput.value.trim());
    }
  } else if(e.key === 'Escape'){
    closeDropdown();
  }
});

function highlightItem(items){
  items.forEach((it, i)=>{
    if(i === activeDropdownIdx){
      it.classList.add('active');
      it.scrollIntoView({block:'nearest'});
    } else {
      it.classList.remove('active');
    }
  });
}

// Change event listeners on selects
document.getElementById('sort').addEventListener('change', ()=>{ page=1; load(); });
document.getElementById('kind').addEventListener('change', ()=>{
  page=1;
  syncFilterPills(document.getElementById('kind').value, activeGenre);
  load();
});

load();
</script>
